<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCMD Cloud · 售前资料与 AI 模型广场</title>
  <meta name="description" content="LCMD Cloud bilingual product pre-sale materials (AI Pod X5-T5000 & LC03 Micro Server) and AI Pod Model Store." />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 11.5L16 8l7 3.5v9L16 24l-7-3.5v-9z' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E"
  />
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-muted: #eef2f6;
      --border: #e5eaf1;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 30px -12px rgba(15, 23, 42, 0.1), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
      --radius-xl: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    html.dark {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-soft: #182131;
      --surface-muted: #1e293b;
      --border: #253247;
      --border-strong: #364762;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --primary-border: rgba(96, 165, 250, 0.32);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 14px 32px -12px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* Sticky Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      object-fit: cover;
      border: 1px solid var(--border);
    }
    .brand-name {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .nav-tabs {
      display: inline-flex;
      gap: 4px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 3px;
    }
    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 15px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .tab-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lang-seg {
      display: inline-flex;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
    }
    .lang-seg button {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-seg button.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .icon-btn:hover { background: var(--surface-soft); }

    /* Main */
    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }

    /* Slim Intro Header */
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    .page-head h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }
    .page-head p {
      margin: 6px 0 0;
      font-size: 15px;
      color: var(--text-secondary);
    }

    /* Product Cards Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .card-cover {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--surface-muted);
      overflow: hidden;
      cursor: zoom-in;
      border-bottom: 1px solid var(--border);
    }
    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.25s ease;
    }
    .card-cover:hover img { transform: scale(1.02); }
    .cover-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .card-body {
      padding: 22px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .card-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.015em;
    }
    .card-sub {
      margin: 5px 0 0;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* Clean 4-Action Grid */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .act-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .act-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }
    .act-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .act-btn.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #ffffff;
    }
    .act-fmt {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      opacity: 0.72;
      flex-shrink: 0;
    }

    .card-foot {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .foot-link {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .foot-link:hover { color: var(--primary); }
    .dot-new {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
    }

    /* Compact Model Store Strip */
    .ms-strip {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px 26px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .ms-strip:hover {
      border-color: var(--primary-border);
      box-shadow: var(--shadow-md);
    }
    .ms-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .ms-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }
    .ms-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }
    .ms-sub {
      margin: 3px 0 0;
      font-size: 13.5px;
      color: var(--text-secondary);
    }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 11px;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn-enter:hover { background: var(--primary-hover); }

    /* Minimal Footer */
    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .footer-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Modal (Product More Files / All Files Drawer) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(15, 23, 42, 0.56);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 740px;
      max-height: 82vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-head h3 { margin: 0; font-size: 17px; font-weight: 800; }
    .modal-search {
      padding: 12px 22px 0;
    }
    .modal-search input {
      width: 100%;
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .modal-search input:focus { border-color: var(--primary); }
    .modal-body {
      padding: 14px 22px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mfile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
    }
    .mfile-info {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mfile-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .mfile-meta {
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .mfile-acts {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .mini-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--primary); color: var(--primary); }
    .badge-fmt {
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .badge-new {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      background: #ef4444;
      color: #ffffff;
    }

    /* HD Image Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
    }
    .lightbox.open { display: flex; }
    .lightbox-bar {
      width: 100%;
      max-width: 1120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      gap: 10px;
    }
    .lightbox-img-wrap {
      max-width: 94vw;
      max-height: 82vh;
      overflow: auto;
      border-radius: 12px;
      background: #0f172a;
    }
    .lightbox-img-wrap img { display: block; max-width: 100%; height: auto; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      background: #0f172a;
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.18s ease;
      z-index: 120;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 860px) {
      .products-grid { grid-template-columns: 1fr; }
      .actions-grid { grid-template-columns: 1fr; }
      .container { padding: 20px 14px 44px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="./">
        <img class="brand-logo" src="assets/logo.jpg" alt="LCMD" onerror="this.style.display='none'" />
        <span class="brand-name">LCMD Cloud</span>
      </a>

      <nav class="nav-tabs" aria-label="Sections">
        <a class="nav-tab active" href="./" id="tab-materials">售前资料</a>
        <a class="nav-tab" href="model-store/" id="tab-models">
          <span id="tab-models-label">AI 模型广场</span>
          <span class="tab-pill" id="tab-models-count">--</span>
        </a>
      </nav>

      <div class="nav-right">
        <div class="lang-seg" role="group" aria-label="Language">
          <button type="button" data-lang="zh" class="active">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="icon-btn" id="btn-theme" title="Theme">🌓</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1 id="page-title">产品售前资料</h1>
        <p id="page-sub">懒猫算力舱 AI Pod X5 与懒猫微服 LC03 官方中英文手册、一图概览与硬件参数</p>
      </div>
      <button type="button" class="mini-btn" id="btn-copy-url">🔗 复制链接</button>
    </div>

    <section class="products-grid" id="products-grid">
      <div style="color:var(--text-muted);padding:32px 0;">Loading…</div>
    </section>

    <section class="ms-strip">
      <div class="ms-left">
        <div class="ms-icon">🤖</div>
        <div>
          <h2 class="ms-title" id="ms-title">AI Pod 模型广场</h2>
          <p class="ms-sub" id="ms-sub">加载中…</p>
        </div>
      </div>
      <a class="btn-enter" href="model-store/" id="ms-enter">查看全部模型 →</a>
    </section>

    <footer class="footer">
      <div id="footer-left">LCMD Cloud · 中英文产品资料与模型中心</div>
      <div class="footer-right">
        <span id="footer-meta">--</span>
        <button type="button" class="foot-link" id="btn-all-files">全部文件</button>
      </div>
    </footer>
  </main>

  <!-- Product / All Files Modal -->
  <div class="modal-backdrop" id="files-modal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-title">更多资料</h3>
        <button type="button" class="mini-btn" id="modal-close">关闭</button>
      </div>
      <div class="modal-search" id="modal-search-wrap" style="display:none;">
        <input type="text" id="modal-search" placeholder="搜索文件名…" autocomplete="off" />
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- HD Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-bar">
      <strong id="lightbox-title" style="font-size:14.5px;"></strong>
      <div style="display:flex;gap:8px;">
        <a class="mini-btn" id="lightbox-open" href="#" target="_blank" rel="noopener">新窗口 ↗</a>
        <a class="mini-btn" id="lightbox-dl" href="#" download>下载 ⬇</a>
        <button type="button" class="mini-btn" id="lightbox-close">关闭</button>
      </div>
    </div>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="" />
    </div>
  </div>

  <div class="toast" id="toast"></div>

          actOverview: 'At-a-Glance',
          actSpecs: 'Hardware Specs',
          actPdf: 'Download PDF',
          actMobile: 'Mobile Brochure',
          actGallery: '12 Promo Posters ↗',
          moreFiles: (n) => `More formats (${n}) ▾`,
          msTitle: 'AI Pod Model Store (Bilingual Catalog)',
          msSub: (ms) => `${ms.visibleCount} one-click local models · ${ms.categoryCount} categories · AGX Thor, Orin & Multi-Node clusters`,
          msEnter: 'Open Model Store →',
          footerLeft: 'LCMD Cloud · Auto-synced daily',
          allFilesBtn: 'All Files',
          allFilesTitle: 'All Synced Files',
          searchPh: 'Search files or product…',
          openText: 'Open',
          previewText: 'Preview',
          dlText: 'Download',
          closeText: 'Close',
          openNew: 'Original ↗',
          dlOrig: 'Download ⬇',
          updatedPrefix: 'Updated ',
        },
      };

      function detectLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        if (q === 'en' || q === 'zh') return q;
        const saved = localStorage.getItem('lcmd-lang');
        if (saved === 'en' || saved === 'zh') return saved;
        return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      }

      const state = {
        lang: detectLang(),
        theme: localStorage.getItem('lcmd-theme') || 'light',
        manifest: null,
        modalItems: [],
        modalTitle: '',
        modalSearchable: false,
      };

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const t = () => I18N[state.lang];
      const isEn = () => state.lang === 'en';
      const isImg = (ext) => ['PNG', 'JPG', 'JPEG', 'WEBP'].includes(ext);

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function fmtSize(mb) {
        return mb < 0.1 ? `${Math.max(1, Math.round(mb * 1024))} KB` : `${mb.toFixed(1)} MB`;
      }

      function toast(msg) {
        const el = $('#toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove('show'), 2000);
      }

      function openLightbox(url, title) {
        $('#lightbox-title').textContent = title;
        $('#lightbox-img').src = url;
        $('#lightbox-open').href = url;
        $('#lightbox-dl').href = url;
        $('#lightbox').classList.add('open');
      }

      function closeLightbox() {
        $('#lightbox').classList.remove('open');
      }

      function openFilesModal(title, items, searchable) {
        state.modalTitle = title;
        state.modalItems = items;
        state.modalSearchable = Boolean(searchable);
        $('#modal-title').textContent = title;
        $('#modal-search-wrap').style.display = searchable ? 'block' : 'none';
        $('#modal-search').value = '';
        renderModalRows('');
        $('#files-modal').classList.add('open');
      }

      function renderModalRows(query) {
        const L = t();
        const q = query.trim().toLowerCase();
        const list = state.modalItems.filter((x) => {
          if (!q) return true;
          return `${x.titleZh} ${x.titleEn} ${x.fileName} ${x.productId} ${x.ext}`.toLowerCase().includes(q);
        });
        $('#modal-body').innerHTML = list
          .map((item) => {
            const label = isEn() ? item.titleEn : item.titleZh;
            const openBtn = isImg(item.ext)
              ? `<button type="button" class="mini-btn js-mpreview" data-url="${esc(item.url)}" data-title="${esc(label)}">${esc(L.previewText)}</button>`
              : `<a class="mini-btn" href="${esc(item.url)}" target="_blank" rel="noopener">${esc(L.openText)} ↗</a>`;
            return `
              <div class="mfile-row">
                <div class="mfile-info">
                  <span class="badge-fmt">${esc(item.ext)}</span>
                  <span class="mfile-name">${esc(label)}</span>
                  ${item.isNew ? '<span class="badge-new">NEW</span>' : ''}
                  <span class="mfile-meta">${esc(fmtSize(item.sizeMB))}</span>
                </div>
                <div class="mfile-acts">
                  ${openBtn}
                  <a class="mini-btn" href="${esc(item.url)}" download>${esc(L.dlText)}</a>
                </div>
              </div>
            `;
          })
          .join('') || '<div style="padding:20px;text-align:center;color:var(--text-muted);">--</div>';

        $$('.js-mpreview').forEach((b) =>
          b.addEventListener('click', () => openLightbox(b.dataset.url, b.dataset.title)),
        );
      }

      /** Pick at most 4 clean, deduplicated primary actions for a product card. */
      function pickPrimaryActions(items) {
        const L = t();
        const find = (pred) => items.find(pred);

        const brochure = find((x) => x.role === 'brochure-desktop') || find((x) => x.ext === 'HTML' && x.role !== 'gallery');
        const overview = find((x) => x.role === 'overview' && x.ext === 'PNG') || find((x) => x.role === 'overview');
        const specs = find((x) => x.role === 'specs' && x.ext === 'PNG') || find((x) => x.role === 'specs');
        const pdf = find((x) => x.role === 'pdf' && !x.fileName.toLowerCase().includes('mobile') && !x.fileName.includes('手机'))
          || find((x) => x.role === 'pdf');

        const chosen = [];
        if (brochure) chosen.push({ item: brochure, label: L.actBrochure, primary: true, lightbox: false });
        if (overview) chosen.push({ item: overview, label: L.actOverview, primary: false, lightbox: isImg(overview.ext) });
        if (specs) chosen.push({ item: specs, label: L.actSpecs, primary: false, lightbox: isImg(specs.ext) });
        if (pdf) chosen.push({ item: pdf, label: L.actPdf, primary: false, lightbox: false });

        // For any brand-new unknown product folder that doesn't match the 4 roles above
        if (!chosen.length) {
          for (const item of items.slice(0, 4)) {
            chosen.push({
              item,
              label: isEn() ? item.titleEn : item.titleZh,
              primary: chosen.length === 0,
              lightbox: isImg(item.ext),
            });
          }
        }
        return chosen;
      }

      function applyChrome() {
        const L = t();
        document.documentElement.lang = isEn() ? 'en' : 'zh-CN';
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
        document.title = L.docTitle;

        $$('[data-lang]').forEach((b) => b.classList.toggle('active', b.dataset.lang === state.lang));

        $('#tab-materials').textContent = L.tabMaterials;
        $('#tab-models-label').textContent = L.tabModels;
        $('#tab-models').href = `model-store/?lang=${state.lang}`;
        $('#ms-enter').href = `model-store/?lang=${state.lang}`;

        $('#page-title').textContent = L.pageTitle;
        $('#page-sub').textContent = L.pageSub;
        $('#btn-copy-url').textContent = L.copyUrl;
        $('#ms-title').textContent = L.msTitle;
        $('#ms-enter').textContent = L.msEnter;
        $('#footer-left').textContent = L.footerLeft;
        $('#btn-all-files').textContent = L.allFilesBtn;
        $('#modal-close').textContent = L.closeText;
        $('#modal-search').placeholder = L.searchPh;
        $('#lightbox-open').textContent = L.openNew;
        $('#lightbox-dl').textContent = L.dlOrig;
        $('#lightbox-close').textContent = L.closeText;
      }

      function render() {
        applyChrome();
        const m = state.manifest;
        if (!m) return;
        const L = t();
        const ms = m.modelStoreSummary || {};

        $('#tab-models-count').textContent = ms.visibleCount ?? '--';
        $('#ms-sub').textContent = L.msSub(ms);
        $('#footer-meta').textContent = `AI Pod v${ms.appVersion || '--'} · ${L.updatedPrefix}${(m.updatedAt || '').slice(0, 10)}`;

        const gridHtml = m.products
          .map((p) => {
            const name = isEn() ? p.nameEn : p.nameZh;
            const tagline = isEn() ? p.taglineEn : p.taglineZh;
            const badge = isEn() ? p.badgeEn : p.badgeZh;
            const preview = isEn() ? (p.previewEn || p.previewZh) : (p.previewZh || p.previewEn);

            let langItems = m.items.filter((x) => x.productId === p.id && x.lang === state.lang);
            if (!langItems.length) langItems = m.items.filter((x) => x.productId === p.id);

            const primaryActions = pickPrimaryActions(langItems);
            const gallery = langItems.find((x) => x.role === 'gallery');
            const mobileHtml = langItems.find((x) => x.role === 'brochure-mobile');

            // Secondary items for the optional drawer (exclude individual 12 posters when gallery exists)
            const drawerItems = langItems.filter((x) => !(gallery && x.role === 'poster'));
            const hasNew = drawerItems.some((x) => x.isNew);

            const actsHtml = primaryActions
              .map(({ item, label, primary, lightbox }) => {
                if (lightbox) {
                  return `
                    <button type="button" class="act-btn ${primary ? 'primary' : ''} js-zoom" data-url="${esc(item.url)}" data-title="${esc(`${name} · ${label}`)}">
                      <span>${esc(label)}</span>
                      <span class="act-fmt">${esc(item.ext)}</span>
                    </button>
                  `;
                }
                return `
                  <a class="act-btn ${primary ? 'primary' : ''}" href="${esc(item.url)}" target="_blank" rel="noopener">
                    <span>${esc(label)}</span>
                    <span class="act-fmt">${esc(item.ext)}</span>
                  </a>
                `;
              })
              .join('');

            const leftFoot = [];
            if (mobileHtml) {
              leftFoot.push(`<a class="foot-link" href="${esc(mobileHtml.url)}" target="_blank" rel="noopener">${esc(L.actMobile)} ↗</a>`);
            }
            if (gallery) {
              leftFoot.push(`<a class="foot-link" href="${esc(gallery.url)}" target="_blank" rel="noopener">${esc(L.actGallery)}</a>`);
            }

            return `
              <article class="product-card">
                ${
                  preview
                    ? `<div class="card-cover js-zoom" data-url="${esc(preview)}" data-title="${esc(name)}">
                        <img src="${esc(preview)}" alt="${esc(name)}" loading="lazy" />
                        <span class="cover-tag">${esc(badge)}</span>
                      </div>`
                    : ''
                }
                <div class="card-body">
                  <div>
                    <h2 class="card-title">${esc(name)}</h2>
                    <p class="card-sub">${esc(tagline)}</p>
                  </div>
                  <div class="actions-grid">${actsHtml}</div>
                  <div class="card-foot">
                    <div style="display:flex;gap:14px;flex-wrap:wrap;">${leftFoot.join('')}</div>
                    <button type="button" class="foot-link js-more" data-pid="${esc(p.id)}">
                      ${hasNew ? '<span class="dot-new"></span>' : ''}
                      <span>${esc(L.moreFiles(drawerItems.length))}</span>
                    </button>
                  </div>
                </div>
              </article>
            `;
          })
          .join('');

        $('#products-grid').innerHTML = gridHtml;

        $$('.js-zoom').forEach((el) =>
          el.addEventListener('click', () => openLightbox(el.dataset.url, el.dataset.title)),
        );

        $$('.js-more').forEach((btn) =>
          btn.addEventListener('click', () => {
            const p = m.products.find((x) => x.id === btn.dataset.pid);
            let items = m.items.filter((x) => x.productId === btn.dataset.pid && x.lang === state.lang);
            if (!items.length) items = m.items.filter((x) => x.productId === btn.dataset.pid);
            const gallery = items.find((x) => x.role === 'gallery');
            const clean = items.filter((x) => !(gallery && x.role === 'poster'));
            openFilesModal(isEn() ? p.nameEn : p.nameZh, clean, false);
          }),
        );
      }

      async function init() {
        applyChrome();
        try {
          const res = await fetch(`./materials/manifest.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          state.manifest = await res.json();
          render();
        } catch (err) {
          $('#products-grid').innerHTML = `<div style="color:var(--text-muted);padding:32px 0;">Failed to load: ${esc(err.message)}</div>`;
        }
      }

      $$('[data-lang]').forEach((b) =>
        b.addEventListener('click', () => {
          state.lang = b.dataset.lang;
          localStorage.setItem('lcmd-lang', state.lang);
          const u = new URL(window.location.href);
          u.searchParams.set('lang', state.lang);
          window.history.replaceState({}, '', u);
          render();
        }),
      );

      $('#btn-theme').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('lcmd-theme', state.theme);
        applyChrome();
      });

      $('#btn-copy-url').addEventListener('click', () => {
        const u = new URL(window.location.href);
        u.searchParams.set('lang', state.lang);
        navigator.clipboard?.writeText(u.href).then(() => toast(t().copiedUrl));
      });

      $('#btn-all-files').addEventListener('click', () => {
        if (!state.manifest) return;
        const langItems = state.manifest.items.filter((x) => x.lang === state.lang);
        openFilesModal(t().allFilesTitle, langItems.length ? langItems : state.manifest.items, true);
      });

      $('#modal-search').addEventListener('input', (e) => renderModalRows(e.target.value));
      $('#modal-close').addEventListener('click', () => $('#files-modal').classList.remove('open'));
      $('#files-modal').addEventListener('click', (e) => {
        if (e.target === $('#files-modal')) $('#files-modal').classList.remove('open');
      });

      $('#lightbox-close').addEventListener('click', closeLightbox);
      $('#lightbox').addEventListener('click', (e) => {
        if (e.target === $('#lightbox')) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeLightbox();
          $('#files-modal').classList.remove('open');
        }
      });

      init();
    })();
  </script>
</body>
</html>
