<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCMD Cloud · 售前资料与 AI 模型广场</title>
  <meta name="description" content="LCMD Cloud bilingual product pre-sale materials (AI Pod X5-T5000 & LC03 Micro Server) and AI Pod Model Store." />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 11.5L16 8l7 3.5v9L16 24l-7-3.5v-9z' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E"
  />
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-muted: #eef2f6;
      --border: #e5eaf1;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --studio-bg: linear-gradient(145deg, #f8fafc 0%, #eef2f7 100%);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 30px -12px rgba(15, 23, 42, 0.1), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
      --radius-xl: 20px;
    }

    html.dark {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-soft: #182131;
      --surface-muted: #1e293b;
      --border: #253247;
      --border-strong: #364762;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --primary-border: rgba(96, 165, 250, 0.32);
      --studio-bg: linear-gradient(145deg, #161f2e 0%, #0f1622 100%);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 14px 32px -12px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* Sticky Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      object-fit: cover;
      border: 1px solid var(--border);
    }
    .brand-name {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .nav-tabs {
      display: inline-flex;
      gap: 4px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 3px;
    }
    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .tab-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lang-seg {
      display: inline-flex;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
    }
    .lang-seg button {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-seg button.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .icon-btn:hover { background: var(--surface-soft); }

    /* Container */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 36px 24px 56px;
    }

    .page-head {
      margin-bottom: 26px;
    }
    .page-head h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    .page-head p {
      margin: 6px 0 0;
      font-size: 15px;
      color: var(--text-secondary);
    }

    /* Product Cards */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .card-visual {
      position: relative;
      height: 230px;
      background: var(--studio-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }
    .card-visual img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.25s ease;
    }
    .product-card:hover .card-visual img {
      transform: scale(1.03);
    }
    .visual-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
    }

    .card-body {
      padding: 22px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .card-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.015em;
    }
    .card-sub {
      margin: 5px 0 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: auto;
    }
    .doc-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .doc-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }
    .doc-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .doc-btn.primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #ffffff;
    }
    .doc-arrow {
      font-size: 13px;
      opacity: 0.72;
      flex-shrink: 0;
    }

    /* Compact Model Store Strip */
    .ms-strip {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 20px 26px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .ms-strip:hover {
      border-color: var(--primary-border);
      box-shadow: var(--shadow-md);
    }
    .ms-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .ms-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }
    .ms-title { margin: 0; font-size: 17px; font-weight: 800; }
    .ms-sub { margin: 3px 0 0; font-size: 13.5px; color: var(--text-secondary); }
    .btn-enter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 11px;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn-enter:hover { background: var(--primary-hover); }

    /* Footer */
    .footer {
      margin-top: 34px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Lightbox for PNG-only items */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
    }
    .lightbox.open { display: flex; }
    .lightbox-bar {
      width: 100%;
      max-width: 1120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      gap: 10px;
    }
    .lb-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .lb-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .lightbox-img-wrap {
      max-width: 94vw;
      max-height: 82vh;
      overflow: auto;
      border-radius: 12px;
      background: #0f172a;
    }
    .lightbox-img-wrap img { display: block; max-width: 100%; height: auto; }

    @media (max-width: 820px) {
      .products-grid { grid-template-columns: 1fr; }
      .container { padding: 22px 14px 44px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="./">
        <img class="brand-logo" src="assets/logo.jpg" alt="LCMD" onerror="this.style.display='none'" />
        <span class="brand-name">LCMD Cloud</span>
      </a>

      <nav class="nav-tabs" aria-label="Sections">
        <a class="nav-tab active" href="./" id="tab-materials">售前资料</a>
        <a class="nav-tab" href="model-store/" id="tab-models">
          <span id="tab-models-label">AI 模型广场</span>
          <span class="tab-pill" id="tab-models-count">--</span>
        </a>
      </nav>

      <div class="nav-right">
        <div class="lang-seg" role="group" aria-label="Language">
          <button type="button" data-lang="zh" class="active">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="icon-btn" id="btn-theme" title="Theme">🌓</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1 id="page-title">产品售前资料</h1>
      <p id="page-sub">AI Pod X5-T5000 与 LC03 官方中英文产品介绍、一图概览与硬件参数</p>
    </div>

    <section class="products-grid" id="products-grid">
      <div style="color:var(--text-muted);padding:32px 0;">Loading…</div>
    </section>

    <section class="ms-strip">
      <div class="ms-left">
        <div class="ms-icon">🤖</div>
        <div>
          <h2 class="ms-title" id="ms-title">AI Pod 模型广场</h2>
          <p class="ms-sub" id="ms-sub">加载中…</p>
        </div>
      </div>
      <a class="btn-enter" href="model-store/" id="ms-enter">进入模型广场 →</a>
    </section>

    <footer class="footer">
      <div id="footer-left">LCMD Cloud</div>
      <div id="footer-meta">--</div>
    </footer>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-bar">
      <strong id="lightbox-title" style="font-size:14.5px;"></strong>
      <div style="display:flex;gap:8px;">
        <a class="lb-btn" id="lightbox-open" href="#" target="_blank" rel="noopener">新窗口打开 ↗</a>
        <button type="button" class="lb-btn" id="lightbox-close">关闭</button>
      </div>
    </div>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="" />
    </div>
  </div>

  <script>
    (function () {
      const I18N = {
        zh: {
          docTitle: 'LCMD Cloud · 售前资料与 AI 模型广场',
          tabMaterials: '售前资料',
          tabModels: 'AI 模型广场',
          pageTitle: '产品售前资料',
          pageSub: 'AI Pod X5-T5000 与 LC03 官方中英文产品介绍、一图概览与硬件参数',
          msTitle: 'AI Pod 模型广场',
          msSub: (ms) => `${ms.visibleCount} 款本地一键部署模型 · ${ms.categoryCount} 大能力分类 · 支持 AGX Thor / Orin / 多机集群`,
          msEnter: '进入模型广场 →',
          footerLeft: 'LCMD Cloud · 每日自动同步',
          openOrig: '新窗口打开 ↗',
          closeText: '关闭',
        },
        en: {
          docTitle: 'LCMD Cloud · Pre-sale Materials & AI Model Store',
          tabMaterials: 'Pre-sale Materials',
          tabModels: 'AI Model Store',
          pageTitle: 'Product Pre-sale Materials',
          pageSub: 'Official Chinese & English brochures, overviews and hardware specs for AI Pod X5-T5000 & LC03',
          msTitle: 'AI Pod Model Store',
          msSub: (ms) => `${ms.visibleCount} one-click local models · ${ms.categoryCount} categories · AGX Thor, Orin & Multi-Node`,
          msEnter: 'Open Model Store →',
          footerLeft: 'LCMD Cloud · Auto-synced daily',
          openOrig: 'Open Original ↗',
          closeText: 'Close',
        },
      };

      function detectLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        if (q === 'en' || q === 'zh') return q;
        const saved = localStorage.getItem('lcmd-lang');
        if (saved === 'en' || saved === 'zh') return saved;
        return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      }

      const state = {
        lang: detectLang(),
        theme: localStorage.getItem('lcmd-theme') || 'light',
        manifest: null,
      };

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const t = () => I18N[state.lang];
      const isEn = () => state.lang === 'en';
      const isImg = (ext) => ['PNG', 'JPG', 'JPEG', 'WEBP'].includes(ext);

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function openLightbox(url, title) {
        $('#lightbox-title').textContent = title;
        $('#lightbox-img').src = url;
        $('#lightbox-open').href = url;
        $('#lightbox').classList.add('open');
      }

      function closeLightbox() {
        $('#lightbox').classList.remove('open');
      }

      function applyChrome() {
        const L = t();
        document.documentElement.lang = isEn() ? 'en' : 'zh-CN';
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
        document.title = L.docTitle;

        $$('[data-lang]').forEach((b) => b.classList.toggle('active', b.dataset.lang === state.lang));

        $('#tab-materials').textContent = L.tabMaterials;
        $('#tab-models-label').textContent = L.tabModels;
        $('#tab-models').href = `model-store/?lang=${state.lang}`;
        $('#ms-enter').href = `model-store/?lang=${state.lang}`;
        $('#page-title').textContent = L.pageTitle;
        $('#page-sub').textContent = L.pageSub;
        $('#ms-title').textContent = L.msTitle;
        $('#ms-enter').textContent = L.msEnter;
        $('#footer-left').textContent = L.footerLeft;
        $('#lightbox-open').textContent = L.openOrig;
        $('#lightbox-close').textContent = L.closeText;
      }

      function render() {
        applyChrome();
        const m = state.manifest;
        if (!m) return;
        const L = t();
        const ms = m.modelStoreSummary || {};

        $('#tab-models-count').textContent = ms.visibleCount ?? '--';
        $('#ms-sub').textContent = L.msSub(ms);
        $('#footer-meta').textContent = `AI Pod v${ms.appVersion || '--'} · ${(m.updatedAt || '').slice(0, 10)}`;

        const gridHtml = m.products
          .map((p) => {
            const name = isEn() ? p.nameEn : p.nameZh;
            const tagline = isEn() ? p.taglineEn : p.taglineZh;
            const badge = isEn() ? p.badgeEn : p.badgeZh;

            let docs = m.items.filter((x) => x.productId === p.id && x.lang === state.lang);
            if (!docs.length) docs = m.items.filter((x) => x.productId === p.id);

            const docsHtml = docs
              .map((item, idx) => {
                const label = isEn() ? item.titleEn : item.titleZh;
                const isPrimary = idx === 0;
                if (isImg(item.ext)) {
                  return `
                    <button type="button" class="doc-btn ${isPrimary ? 'primary' : ''} js-zoom" data-url="${esc(item.url)}" data-title="${esc(`${name} · ${label}`)}">
                      <span>${esc(label)}</span>
                      <span class="doc-arrow">↗</span>
                    </button>
                  `;
                }
                return `
                  <a class="doc-btn ${isPrimary ? 'primary' : ''}" href="${esc(item.url)}" target="_blank" rel="noopener">
                    <span>${esc(label)}</span>
                    <span class="doc-arrow">↗</span>
                  </a>
                `;
              })
              .join('');

            return `
              <article class="product-card">
                ${
                  p.cover
                    ? `<div class="card-visual">
                        <span class="visual-badge">${esc(badge)}</span>
                        <img src="${esc(p.cover)}" alt="${esc(name)}" loading="lazy" />
                      </div>`
                    : ''
                }
                <div class="card-body">
                  <div>
                    <h2 class="card-title">${esc(name)}</h2>
                    <p class="card-sub">${esc(tagline)}</p>
                  </div>
                  <div class="doc-list">${docsHtml}</div>
                </div>
              </article>
            `;
          })
          .join('');

        $('#products-grid').innerHTML = gridHtml;
        $$('.js-zoom').forEach((el) =>
          el.addEventListener('click', () => openLightbox(el.dataset.url, el.dataset.title)),
        );
      }

      async function init() {
        applyChrome();
        try {
          const res = await fetch(`./materials/manifest.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          state.manifest = await res.json();
          render();
        } catch (err) {
          $('#products-grid').innerHTML = `<div style="color:var(--text-muted);padding:32px 0;">Failed to load: ${esc(err.message)}</div>`;
        }
      }

      $$('[data-lang]').forEach((b) =>
        b.addEventListener('click', () => {
          state.lang = b.dataset.lang;
          localStorage.setItem('lcmd-lang', state.lang);
          const u = new URL(window.location.href);
          u.searchParams.set('lang', state.lang);
          window.history.replaceState({}, '', u);
          render();
        }),
      );

      $('#btn-theme').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('lcmd-theme', state.theme);
        applyChrome();
      });

      $('#lightbox-close').addEventListener('click', closeLightbox);
      $('#lightbox').addEventListener('click', (e) => {
        if (e.target === $('#lightbox')) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
      });

      init();
    })();
  </script>
</body>
</html>
