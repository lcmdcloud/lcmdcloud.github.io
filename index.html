<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCMD Cloud · 微服 / 算力舱 / AI 模型广场</title>
  <meta name="description" content="LCMD Cloud bilingual desktop portal: LC03 Micro Server, AI Pod X5-T5000, AI Model Store, and Official Websites (lazycat.cloud / lcmd.cloud)." />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 11.5L16 8l7 3.5v9L16 24l-7-3.5v-9z' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E"
  />
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-muted: #eef2f6;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    html.dark {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-soft: #182131;
      --surface-muted: #1e293b;
      --border: #253247;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --primary-border: rgba(96, 165, 250, 0.34);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Row 1: Primary Top Navigation */
    .topbar {
      height: 54px;
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      z-index: 40;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--text);
      flex-shrink: 0;
    }
    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
    }
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .top-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 3px;
    }
    .top-tab {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 6px 15px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.14s ease;
    }
    .top-tab:hover { color: var(--text); }
    .top-tab.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .tab-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
    }
    .tool-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }
    .tool-btn.accent {
      background: var(--primary-soft);
      border-color: var(--primary-border);
      color: var(--primary);
      font-weight: 700;
    }
    .tool-btn.accent:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .lang-seg {
      display: inline-flex;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
    }
    .lang-seg button {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-seg button.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Row 2: Compact Product Sub-Tabs Bar (100% full desktop width below!) */
    .subbar {
      height: 44px;
      flex-shrink: 0;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 30;
    }
    .subbar.hidden { display: none; }

    .sub-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }
    .sub-prod-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      padding-right: 14px;
      border-right: 1px solid var(--border);
    }
    .sub-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sub-tab {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      height: 44px;
      padding: 0 14px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2.5px solid transparent;
      transition: all 0.14s ease;
      white-space: nowrap;
    }
    .sub-tab:hover { color: var(--text); }
    .sub-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .sub-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Full-Width Stage (100vw!) */
    .stage {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
      background: var(--bg);
    }

    .doc-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
      display: block;
    }
    html.dark .doc-frame.models-frame { background: #0b0f17; }

    .frame-loader {
      position: absolute;
      inset: 0;
      z-index: 15;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 14px;
      transition: opacity 0.18s ease;
    }
    .frame-loader.done { opacity: 0; pointer-events: none; }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Product Preview Gallery */
    .gallery-stage {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 28px 36px 52px;
    }
    .gallery-inner {
      max-width: 1440px;
      margin: 0 auto;
    }
    .gallery-head {
      margin-bottom: 18px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .gallery-head h2 { margin: 0; font-size: 21px; font-weight: 800; }
    .gallery-head span { font-size: 13.5px; color: var(--text-muted); }
    .gallery-wide {
      margin-bottom: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: zoom-in;
      box-shadow: var(--shadow-sm);
    }
    .gallery-wide img { width: 100%; height: auto; display: block; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }
    .gallery-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: zoom-in;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .gallery-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .gallery-thumb {
      aspect-ratio: 4 / 3;
      background: var(--surface-soft);
      overflow: hidden;
    }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-cap {
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      border-top: 1px solid var(--border);
    }

    /* Official Site Panel */
    .official-panel {
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 48px 24px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .official-card {
      width: 100%;
      max-width: 780px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 32px 36px;
      box-shadow: var(--shadow-sm);
    }
    .official-eyebrow {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .official-card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
    .official-card p { margin: 0 0 22px; font-size: 15px; color: var(--text-secondary); }
    .official-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .official-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .official-link:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }
    .official-link strong { display: block; font-size: 15.5px; }
    .official-link span { display: block; font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
    .official-link.wide { grid-column: span 2; }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
    }
    .lightbox.open { display: flex; }
    .lightbox-bar {
      width: 100%;
      max-width: 1240px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      gap: 10px;
    }
    .lb-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .lb-btn:hover { background: rgba(255, 255, 255, 0.24); }
    .lightbox-img-wrap {
      max-width: 94vw;
      max-height: 82vh;
      overflow: auto;
      border-radius: 12px;
      background: #0f172a;
    }
    .lightbox-img-wrap img { display: block; max-width: 100%; max-height: 80vh; width: auto; height: auto; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#lc03/brochure">
      <img class="brand-logo" src="assets/logo.jpg" alt="LCMD" onerror="this.style.display='none'" />
      <span class="brand-name">LCMD Cloud</span>
    </a>

    <nav class="top-tabs" id="top-tabs" aria-label="Main sections"></nav>

    <div class="top-right">
      <a class="tool-btn accent" id="btn-site-shortcut" href="https://lazycat.cloud/" target="_blank" rel="noopener">lazycat.cloud ↗</a>
      <a class="tool-btn" id="btn-open-new" href="#" target="_blank" rel="noopener" style="display:none;">
        <span id="btn-open-label">新窗口</span> ↗
      </a>
      <div class="lang-seg" role="group" aria-label="Language">
        <button type="button" data-lang="zh" class="active">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="tool-btn" id="btn-theme" title="Theme" style="padding:0 9px;">🌓</button>
    </div>
  </header>

  <div class="subbar" id="subbar">
    <div class="sub-left">
      <span class="sub-prod-name" id="sub-prod-name">--</span>
      <nav class="sub-tabs" id="sub-tabs"></nav>
    </div>
    <div class="sub-right" id="sub-right"></div>
  </div>

  <main class="stage" id="stage">
    <div class="frame-loader"><div class="spinner"></div><span>Loading…</span></div>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-bar">
      <strong id="lb-title" style="font-size:14.5px;"></strong>
      <div style="display:flex;gap:8px;align-items:center;">
        <button type="button" class="lb-btn" id="lb-prev">←</button>
        <button type="button" class="lb-btn" id="lb-next">→</button>
        <a class="lb-btn" id="lb-open" href="#" target="_blank" rel="noopener">原图 ↗</a>
        <button type="button" class="lb-btn" id="lb-close">关闭</button>
      </div>
    </div>
    <div class="lightbox-img-wrap">
      <img id="lb-img" src="" alt="" />
    </div>
  </div>

  <script>
    (function () {
      const I18N = {
        zh: {
          docTitle: 'LCMD Cloud · 微服 / 算力舱 / AI 模型广场',
          tabLC03: '微服介绍资料',
          tabX5: '算力舱介绍资料',
          tabModels: 'AI 模型广场',
          tabOfficial: '官网',
          siteShortcutLabel: 'lazycat.cloud ↗',
          siteShortcutUrl: 'https://lazycat.cloud/',
          galleryLabel: '产品预览图集',
          gallerySub: (n) => `共 ${n} 张高清实拍与功能预览图 · 点击任意图片放大查看`,
          openNew: '独立打开',
          loadingDoc: '正在加载桌面版页面…',
          slowHint: '加载较慢？新窗口打开 ↗',
          officialProductBtn: '官网产品页 ↗',
          officialEyebrow: '中文官网 · lazycat.cloud',
          officialTitle: '懒猫官方入口',
          officialSub: '直达懒猫微服、懒猫算力舱 AI Pod 官方网站与应用商店。',
          officialLinks: [
            { title: '懒猫微服官网首页', desc: 'lazycat.cloud — 品牌主页与最新产品动态', url: 'https://lazycat.cloud/', wide: true },
            { title: '懒猫微服 LC03 官方产品页', desc: 'lazycat.cloud/lcmd — 私有云主机介绍与配置', url: 'https://lazycat.cloud/lcmd' },
            { title: '懒猫算力舱 AI Pod 官方产品页', desc: 'lazycat.cloud/ai-pod — 桌面级 AI 算力舱介绍与配置', url: 'https://lazycat.cloud/ai-pod' },
            { title: '懒猫应用商店', desc: 'lazycat.cloud/appstore — 4500+ 私有云与 AI 应用', url: 'https://lazycat.cloud/appstore/', wide: true },
          ],
          openOrig: '原图 ↗',
          closeText: '关闭',
        },
        en: {
          docTitle: 'LCMD Cloud · Micro Server / AI Pod / Model Store',
          tabLC03: 'Micro Server (LC03)',
          tabX5: 'AI Pod (X5-T5000)',
          tabModels: 'AI Model Store',
          tabOfficial: 'Official Site',
          siteShortcutLabel: 'lcmd.cloud ↗',
          siteShortcutUrl: 'https://lcmd.cloud/',
          galleryLabel: 'Product Previews',
          gallerySub: (n) => `${n} HD hardware & feature previews · click any image to enlarge`,
          openNew: 'Open Fullscreen',
          loadingDoc: 'Loading desktop page…',
          slowHint: 'Taking a while? Open in new tab ↗',
          officialProductBtn: 'Official Page (lcmd.cloud) ↗',
          officialEyebrow: 'Global Official Website · lcmd.cloud',
          officialTitle: 'LCMD Global Official Site',
          officialSub: 'For international customers, visit lcmd.cloud for official Micro Server & AI Pod product pages and ordering.',
          officialLinks: [
            { title: 'LCMD Global Homepage', desc: 'lcmd.cloud — Official international portal', url: 'https://lcmd.cloud/', wide: true },
            { title: 'LCMD Micro Server (LC03)', desc: 'lcmd.cloud/lcmd — Private cloud server specs & overview', url: 'https://lcmd.cloud/lcmd' },
            { title: 'LCMD AI Pod', desc: 'lcmd.cloud/ai-pod — Local AI supercomputing appliance', url: 'https://lcmd.cloud/ai-pod' },
            { title: 'LCMD App Store', desc: 'lcmd.cloud/appstore — 4,500+ self-hosted & AI apps', url: 'https://lcmd.cloud/appstore', wide: true },
          ],
          openOrig: 'Original ↗',
          closeText: 'Close',
        },
      };

      function detectLang() {
        const q = new URLSearchParams(window.location.search).get('lang');
        if (q === 'en' || q === 'zh') return q;
        const saved = localStorage.getItem('lcmd-lang');
        if (saved === 'en' || saved === 'zh') return saved;
        return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      }

      const state = {
        lang: detectLang(),
        theme: localStorage.getItem('lcmd-theme') || 'light',
        manifest: null,
        section: 'LC03',
        slot: 'brochure',
        lbList: [],
        lbIndex: 0,
      };

      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const t = () => I18N[state.lang];
      const isEn = () => state.lang === 'en';

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function withVer(url) {
        const v = state.manifest?.buildVer || '';
        if (!v || !url) return url;
        return url + (url.includes('?') ? '&' : '?') + 'v=' + v;
      }

      function sectionTabLabel(pid) {
        const L = t();
        if (pid === 'LC03') return L.tabLC03;
        if (pid === 'AI-Pod-X5') return L.tabX5;
        const p = state.manifest?.products?.find((x) => x.id === pid);
        return p ? (isEn() ? p.nameEn : p.nameZh) : pid;
      }

      function sectionSlug(pid) {
        if (pid === 'LC03') return 'lc03';
        if (pid === 'AI-Pod-X5') return 'aipod';
        return pid.toLowerCase();
      }

      function resolveSectionFromSlug(slug) {
        if (!slug) return 'LC03';
        const s = slug.toLowerCase();
        if (s === 'lc03') return 'LC03';
        if (s === 'aipod' || s === 'ai-pod-x5' || s === 'x5') return 'AI-Pod-X5';
        if (s === 'models' || s === 'model-store') return 'models';
        if (s === 'official') return 'official';
        const match = state.manifest?.products?.find((p) => p.id.toLowerCase() === s || p.slug === s);
        return match ? match.id : 'LC03';
      }

      function parseHash() {
        const raw = window.location.hash.replace(/^#/, '');
        if (!raw) return;
        const [secSlug, slotSlug] = raw.split('/');
        state.section = resolveSectionFromSlug(secSlug);
        if (slotSlug) state.slot = decodeURIComponent(slotSlug);
      }

      function syncHash() {
        let hash = '';
        if (state.section === 'models') hash = '#models';
        else if (state.section === 'official') hash = '#official';
        else hash = `#${sectionSlug(state.section)}/${encodeURIComponent(state.slot)}`;
        if (window.location.hash !== hash) {
          window.history.replaceState({}, '', `${window.location.pathname}?lang=${state.lang}${hash}`);
        }
      }

      function getProductDocs(pid) {
        const m = state.manifest;
        if (!m) return [];
        let docs = m.items.filter((x) => x.productId === pid && x.lang === state.lang);
        if (!docs.length) docs = m.items.filter((x) => x.productId === pid);
        return docs;
      }

      function getProductGallery(product) {
        if (!product?.gallery) return [];
        const g = product.gallery[state.lang];
        return g && g.length ? g : (product.gallery.zh || product.gallery.en || []);
      }

      function openLightbox(list, idx) {
        state.lbList = list;
        state.lbIndex = idx;
        renderLightbox();
        $('#lightbox').classList.add('open');
      }

      function renderLightbox() {
        const item = state.lbList[state.lbIndex];
        if (!item) return;
        const title = isEn() ? item.titleEn : item.titleZh;
        const u = withVer(item.url);
        $('#lb-title').textContent = `${title} (${state.lbIndex + 1}/${state.lbList.length})`;
        $('#lb-img').src = u;
        $('#lb-open').href = u;
        $('#lb-prev').style.display = state.lbList.length > 1 ? 'inline-block' : 'none';
        $('#lb-next').style.display = state.lbList.length > 1 ? 'inline-block' : 'none';
      }

      function closeLightbox() {
        $('#lightbox').classList.remove('open');
      }

      function mountIframe(srcUrl, title, extraClass) {
        const L = t();
        const stage = $('#stage');
        stage.innerHTML = `
          <div class="frame-loader" id="frame-loader">
            <div class="spinner"></div>
            <span>${esc(L.loadingDoc)}</span>
            <a class="tool-btn" href="${esc(srcUrl)}" target="_blank" rel="noopener" style="margin-top:4px;">${esc(L.slowHint)}</a>
          </div>
          <iframe class="doc-frame ${extraClass || ''}" id="doc-frame" src="${esc(srcUrl)}" title="${esc(title)}"></iframe>
        `;
        const frame = $('#doc-frame');
        const loader = $('#frame-loader');
        frame.addEventListener('load', () => loader?.classList.add('done'));
        setTimeout(() => loader?.classList.add('done'), 8000);
      }

      function renderTopbar() {
        const L = t();
        document.documentElement.lang = isEn() ? 'en' : 'zh-CN';
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
        document.title = L.docTitle;
        $$('[data-lang]').forEach((b) => b.classList.toggle('active', b.dataset.lang === state.lang));

        $('#btn-site-shortcut').textContent = L.siteShortcutLabel;
        $('#btn-site-shortcut').href = L.siteShortcutUrl;
        $('#btn-open-label').textContent = L.openNew;
        $('#lb-open').textContent = L.openOrig;
        $('#lb-close').textContent = L.closeText;

        const m = state.manifest;
        const products = m?.products || [];
        const modelCount = m?.modelStoreSummary?.visibleCount ?? '--';

        const tabs = [
          ...products.map(
            (p) => `
              <button type="button" class="top-tab ${state.section === p.id ? 'active' : ''}" data-sec="${esc(p.id)}">
                ${esc(sectionTabLabel(p.id))}
              </button>
            `,
          ),
          `<button type="button" class="top-tab ${state.section === 'models' ? 'active' : ''}" data-sec="models">
            <span>${esc(L.tabModels)}</span>
            <span class="tab-badge">${esc(modelCount)}</span>
          </button>`,
          `<button type="button" class="top-tab ${state.section === 'official' ? 'active' : ''}" data-sec="official">
            <span>${esc(L.tabOfficial)}</span>
          </button>`,
        ];

        $('#top-tabs').innerHTML = tabs.join('');
        $$('#top-tabs [data-sec]').forEach((btn) =>
          btn.addEventListener('click', () => {
            const sec = btn.dataset.sec;
            state.section = sec;
            if (sec !== 'models' && sec !== 'official') {
              const prod = m.products.find((p) => p.id === sec);
              const docs = getProductDocs(sec);
              const hasGallery = getProductGallery(prod).length > 0;
              const validSlot = (state.slot === 'gallery' && hasGallery) || docs.some((d) => d.slot === state.slot);
              if (!validSlot && docs.length) state.slot = docs[0].slot;
            }
            syncHash();
            render();
          }),
        );
      }

      function renderStage() {
        const L = t();
        const m = state.manifest;
        const subbar = $('#subbar');
        const stage = $('#stage');
        const openBtn = $('#btn-open-new');
        if (!m) return;

        // 1. Model Store
        if (state.section === 'models') {
          subbar.classList.add('hidden');
          const url = `model-store/?lang=${state.lang}&theme=${state.theme}&embed=1&v=${m.buildVer || ''}`;
          openBtn.style.display = 'inline-flex';
          openBtn.href = `model-store/?lang=${state.lang}`;
          mountIframe(url, 'AI Model Store', 'models-frame');
          return;
        }

        // 2. Official Site (ZH -> lazycat.cloud + ai-pod; EN -> lcmd.cloud + ai-pod)
        if (state.section === 'official') {
          subbar.classList.add('hidden');
          openBtn.style.display = 'inline-flex';
          openBtn.href = L.siteShortcutUrl;
          stage.innerHTML = `
            <div class="official-panel">
              <div class="official-card">
                <div class="official-eyebrow">${esc(L.officialEyebrow)}</div>
                <h2>${esc(L.officialTitle)}</h2>
                <p>${esc(L.officialSub)}</p>
                <div class="official-grid">
                  ${L.officialLinks
                    .map(
                      (lk) => `
                        <a class="official-link ${lk.wide ? 'wide' : ''}" href="${esc(lk.url)}" target="_blank" rel="noopener">
                          <div>
                            <strong>${esc(lk.title)}</strong>
                            <span>${esc(lk.desc)}</span>
                          </div>
                          <span>↗</span>
                        </a>
                      `,
                    )
                    .join('')}
                </div>
              </div>
            </div>
          `;
          return;
        }

        // 3. Product Section (Full-Width Desktop HTML!)
        const product = m.products.find((p) => p.id === state.section) || m.products[0];
        if (!product) return;
        state.section = product.id;

        const docs = getProductDocs(product.id);
        const gallery = getProductGallery(product);

        const navItems = [
          ...docs.map((d) => ({ slot: d.slot, label: isEn() ? d.titleEn : d.titleZh, doc: d })),
          ...(gallery.length ? [{ slot: 'gallery', label: L.galleryLabel, gallery }] : []),
        ];

        let active = navItems.find((x) => x.slot === state.slot) || navItems[0];
        if (active) state.slot = active.slot;

        subbar.classList.remove('hidden');
        $('#sub-prod-name').textContent = isEn() ? product.nameEn : product.nameZh;

        $('#sub-tabs').innerHTML = navItems
          .map(
            (item) => `
              <button type="button" class="sub-tab ${active && item.slot === active.slot ? 'active' : ''}" data-slot="${esc(item.slot)}">
                ${esc(item.label)}
              </button>
            `,
          )
          .join('');

        $$('#sub-tabs [data-slot]').forEach((btn) =>
          btn.addEventListener('click', () => {
            state.slot = btn.dataset.slot;
            syncHash();
            render();
          }),
        );

        const officialUrl = isEn() ? (product.officialEn || 'https://lcmd.cloud/') : (product.officialZh || 'https://lazycat.cloud/');
        $('#sub-right').innerHTML = `
          <span>${esc((m.updatedAt || '').slice(0, 10))}</span>
          <a class="tool-btn" href="${esc(officialUrl)}" target="_blank" rel="noopener">${esc(L.officialProductBtn)}</a>
        `;

        if (!active) return;

        // 3a. Product Preview Gallery
        if (active.slot === 'gallery') {
          openBtn.style.display = 'none';
          const wideItem = gallery.find((g) => g.wide);
          const gridItems = gallery.filter((g) => !g.wide);
          stage.innerHTML = `
            <div class="gallery-stage">
              <div class="gallery-inner">
                <div class="gallery-head">
                  <h2>${esc(isEn() ? product.nameEn : product.nameZh)} · ${esc(L.galleryLabel)}</h2>
                  <span>${esc(L.gallerySub(gallery.length))}</span>
                </div>
                ${
                  wideItem
                    ? `<div class="gallery-wide js-gal" data-idx="0">
                        <img src="${esc(withVer(wideItem.url))}" alt="${esc(isEn() ? wideItem.titleEn : wideItem.titleZh)}" loading="lazy" />
                      </div>`
                    : ''
                }
                <div class="gallery-grid">
                  ${gridItems
                    .map((g) => {
                      const idx = gallery.indexOf(g);
                      const cap = isEn() ? g.titleEn : g.titleZh;
                      return `
                        <article class="gallery-card js-gal" data-idx="${idx}">
                          <div class="gallery-thumb">
                            <img src="${esc(withVer(g.url))}" alt="${esc(cap)}" loading="lazy" />
                          </div>
                          <div class="gallery-cap">${esc(cap)}</div>
                        </article>
                      `;
                    })
                    .join('')}
                </div>
              </div>
            </div>
          `;
          $$('.js-gal').forEach((el) =>
            el.addEventListener('click', () => openLightbox(gallery, Number(el.dataset.idx))),
          );
          return;
        }

        // 3b. Pure Desktop HTML Document (100% full-width!)
        const docUrl = withVer(active.doc.url);
        openBtn.style.display = 'inline-flex';
        openBtn.href = docUrl;
        mountIframe(docUrl, active.label, '');
      }

      function render() {
        renderTopbar();
        renderStage();
      }

      async function init() {
        try {
          const res = await fetch(`./materials/manifest.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          state.manifest = await res.json();
          parseHash();
          syncHash();
          render();
        } catch (err) {
          $('#stage').innerHTML = `<div class="frame-loader"><span>Failed to load: ${esc(err.message)}</span></div>`;
        }
      }

      $$('[data-lang]').forEach((b) =>
        b.addEventListener('click', () => {
          state.lang = b.dataset.lang;
          localStorage.setItem('lcmd-lang', state.lang);
          syncHash();
          render();
        }),
      );

      $('#btn-theme').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('lcmd-theme', state.theme);
        render();
      });

      $('#lb-close').addEventListener('click', closeLightbox);
      $('#lb-prev').addEventListener('click', () => {
        state.lbIndex = (state.lbIndex - 1 + state.lbList.length) % state.lbList.length;
        renderLightbox();
      });
      $('#lb-next').addEventListener('click', () => {
        state.lbIndex = (state.lbIndex + 1) % state.lbList.length;
        renderLightbox();
      });
      $('#lightbox').addEventListener('click', (e) => {
        if (e.target === $('#lightbox')) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if (!$('#lightbox').classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') $('#lb-prev').click();
        if (e.key === 'ArrowRight') $('#lb-next').click();
      });

      window.addEventListener('hashchange', () => {
        parseHash();
        render();
      });

      init();
    })();
  </script>
</body>
</html>
