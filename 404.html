<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>懒猫微服 / LCMD · 正在跳转</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .box { max-width: 460px; margin: 20px; padding: 28px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; text-align: center; box-shadow: 0 8px 24px -8px rgba(15,23,42,.08); }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 18px; font-size: 13.5px; color: #64748b; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    a { padding: 7px 13px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; color: #2563eb; text-decoration: none; font-size: 13px; font-weight: 600; }
    a:hover { background: #eff6ff; border-color: #bfdbfe; }
  </style>
  <script>
    (function () {
      var rawPath = decodeURIComponent(window.location.pathname || '/');
      var parts = rawPath.split('/').filter(Boolean).map(function (s) { return s.trim().toLowerCase(); });
      var params = new URLSearchParams(window.location.search);
      var lang = params.get('lang') || '';
      if (parts[0] === 'zh' || parts[0] === 'en') {
        lang = parts.shift();
        params.set('lang', lang);
        try { localStorage.setItem('lcmd-lang', lang); } catch (e) {}
      }
      var seg0 = (parts[0] || '').replace(/[\s_]+/g, '-');
      var seg1 = (parts[1] || '').replace(/[\s_]+/g, '-');
      var qs = params.toString();
      var qStr = qs ? '?' + qs : '';

      var docSlot = (seg1 === 'overview' || seg1 === 'specs' || seg1 === 'brochure') ? seg1 : 'brochure';
      var dest = '';

      if (seg0 === 'lc03' || seg0 === 'micro-server' || seg0 === 'microserver') {
        dest = '/' + qStr + '#lc03/' + docSlot;
      } else if (seg0 === 'x5' || seg0 === 'aipod' || seg0 === 'ai-pod' || seg0 === 'ai-pod-x5' || seg0 === 'x5-t5000') {
        dest = '/' + qStr + '#x5/' + docSlot;
      } else if (seg0 === 'model-store' || seg0 === 'models-store' || seg0 === 'modelstore') {
        dest = '/model-store/' + qStr;
      } else if (seg0 === 'models' || seg0 === 'model') {
        dest = '/' + qStr + '#models';
      } else if (seg0 === 'official' || seg0 === 'site') {
        dest = '/' + qStr + '#official';
      } else if (lang && !seg0) {
        dest = '/' + qStr;
      }

      if (dest) {
        window.location.replace(dest);
      }
    })();
  </script>
</head>
<body>
  <div class="box">
    <h1>懒猫微服 / LCMD 产品资料中心</h1>
    <p>未找到该路径，请选择以下直达入口：</p>
    <div class="links">
      <a href="/lc03">微服 LC03</a>
      <a href="/x5">算力舱 X5</a>
      <a href="/model-store/">模型广场</a>
      <a href="/official">官网入口</a>
    </div>
  </div>
</body>
</html>
