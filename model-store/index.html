<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>懒猫 AI Pod 模型广场 · 支持模型一览</title>
  <link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png" />
  <link rel="shortcut icon" href="../favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --ink: #0f172a;
      --ink-2: #475569;
      --ink-3: #64748b;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --blue-line: #bfdbfe;
      --cyan: #0284c7;
      --cyan-soft: #f0f9ff;
      --cyan-line: #bae6fd;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-line: #a7f3d0;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-line: #fde68a;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --rose-line: #fecdd3;
      --violet: #7c3aed;
      --violet-soft: #f5f3ff;
      --violet-line: #ddd6fe;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 28px -10px rgba(15, 23, 42, 0.12), 0 4px 10px -4px rgba(15, 23, 42, 0.05);

      /* Font scale (default = normal for sharp benchmark density) */
      --fs-h1: clamp(24px, 2.8vw, 34px);
      --fs-sub: 14.5px;
      --fs-sec: 19px;
      --fs-title: 17px;
      --fs-desc: 13.5px;
      --fs-metric: 17px;
      --fs-metric-lbl: 11px;
      --card-pad: 20px;
    }

    html[data-scale="large"] {
      --fs-h1: clamp(26px, 3vw, 38px);
      --fs-sub: 15.5px;
      --fs-sec: 21px;
      --fs-title: 19px;
      --fs-desc: 15px;
      --fs-metric: 19px;
      --fs-metric-lbl: 12px;
      --card-pad: 22px;
    }

    html[data-scale="xlarge"] {
      --fs-h1: clamp(30px, 3.3vw, 42px);
      --fs-sub: 17px;
      --fs-sec: 24px;
      --fs-title: 21px;
      --fs-desc: 16.5px;
      --fs-metric: 21px;
      --fs-metric-lbl: 13px;
      --card-pad: 24px;
    }

    html.dark {
      --bg: #0b101b;
      --surface: #121927;
      --surface-2: #172032;
      --surface-3: #1e293b;
      --ink: #f8fafc;
      --ink-2: #cbd5e1;
      --ink-3: #94a3b8;
      --line: #233046;
      --line-strong: #334563;
      --blue: #60a5fa;
      --blue-soft: rgba(59, 130, 246, 0.14);
      --blue-line: rgba(96, 165, 250, 0.34);
      --cyan: #38bdf8;
      --cyan-soft: rgba(14, 165, 233, 0.14);
      --cyan-line: rgba(56, 189, 248, 0.34);
      --green: #34d399;
      --green-soft: rgba(16, 185, 129, 0.14);
      --green-line: rgba(52, 211, 153, 0.34);
      --amber: #fbbf24;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --amber-line: rgba(251, 191, 36, 0.34);
      --rose: #fb7185;
      --rose-soft: rgba(244, 63, 94, 0.14);
      --rose-line: rgba(251, 113, 133, 0.34);
      --violet: #a78bfa;
      --violet-soft: rgba(139, 92, 246, 0.16);
      --violet-line: rgba(167, 139, 250, 0.34);
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 16px 36px -12px rgba(0, 0, 0, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scrollbar-gutter: stable;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(ellipse 75% 28% at 50% -6%, rgba(37, 99, 235, 0.065), transparent 72%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    html.dark body {
      background-image: radial-gradient(ellipse 75% 30% at 50% -8%, rgba(59, 130, 246, 0.12), transparent 72%);
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #content {
      animation: fadeUp 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==================== Standalone Topbar (Hidden in Embed Mode) ==================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 45;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line);
    }

    body.embed-mode .topbar { display: none !important; }

    .topbar-inner {
      max-width: 1320px;
      margin: 0 auto;
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .top-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      font-size: 14.5px;
      font-weight: 700;
    }

    .top-brand img {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      object-fit: contain;
    }

    .top-brand small {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid var(--blue-line);
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .top-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* ==================== Main Wrapper ==================== */
    .wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 26px 24px 64px;
    }

    body.embed-mode .wrap {
      padding-top: 22px;
    }

    /* ==================== Editorial Page Header (Benchmark Style, Light) ==================== */
    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) auto;
      gap: 20px 28px;
      align-items: end;
      padding-bottom: 22px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .kicker-row {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .kicker {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--blue);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      flex-shrink: 0;
    }

    .ver-pill {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-2);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 8px;
    }

    .filter-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--cyan);
      background: var(--cyan-soft);
      border: 1px solid var(--cyan-line);
      border-radius: 4px;
      padding: 2px 8px;
      display: none;
    }
    .filter-tag.show { display: inline-flex; }

    .page-head h1 {
      margin: 0;
      font-size: var(--fs-h1);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--ink);
    }

    .page-sub {
      margin: 8px 0 0;
      font-size: var(--fs-sub);
      color: var(--ink-2);
      max-width: 700px;
      line-height: 1.6;
    }

    /* Hairline KPI Strip */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(76px, auto));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }

    .kpi-cell {
      background: var(--surface);
      padding: 11px 15px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 82px;
    }

    .kpi-val {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .kpi-val.blue { color: var(--blue); }
    .kpi-val.cyan { color: var(--cyan); }
    .kpi-val.green { color: var(--green); }
    .kpi-val.amber { color: var(--amber); }

    .kpi-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .head-stamp {
      margin-top: 7px;
      text-align: right;
      font-size: 11.5px;
      color: var(--ink-3);
    }

    /* ==================== Update Banner ==================== */
    .update-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      background: var(--blue-soft);
      border: 1px solid var(--blue-line);
      border-left: 3px solid var(--blue);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--ink);
    }

    /* ==================== Control & Filter Bar ==================== */
    .controls-shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .seg {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }

    .seg button {
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--ink-2);
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .seg button:last-child { border-right: 0; }
    .seg button:hover { background: var(--surface-2); color: var(--ink); }
    .seg button.active {
      background: var(--ink);
      color: var(--surface);
    }

    html.dark .seg button.active {
      background: var(--blue);
      color: #0b101b;
    }

    .search-box {
      position: relative;
      width: 250px;
    }

    .search-input {
      width: 100%;
      padding: 7px 28px 7px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      outline: none;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-input::placeholder { color: var(--ink-3); }
    .search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: var(--surface-3);
      color: var(--ink-2);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .search-clear.show { display: inline-flex; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-2);
      padding: 7px 11px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .btn:hover {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--surface-2);
    }

    .btn-accent {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }
    .btn-accent:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    .hidden-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-3);
      cursor: pointer;
      user-select: none;
      padding: 4px 6px;
    }
    .hidden-toggle input { accent-color: var(--blue); cursor: pointer; }

    /* Category Pills Strip */
    .pills-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 2px;
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-2);
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .pill:hover {
      border-color: var(--line-strong);
      color: var(--ink);
      background: var(--surface-2);
    }

    .pill.active {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: var(--blue);
    }

    .pill .cnt {
      font-size: 11px;
      opacity: 0.72;
    }

    /* ==================== Section Divider ==================== */
    .cat-section {
      margin-bottom: 30px;
    }

    .cat-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .cat-bar {
      width: 4px;
      height: 17px;
      border-radius: 2px;
      align-self: center;
      flex-shrink: 0;
    }

    .cat-title {
      margin: 0;
      font-size: var(--fs-sec);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .cat-sub {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .cat-count {
      margin-left: auto;
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 8px;
    }

    /* ==================== Benchmark-Grade Light Cards (2-Col Wide Grid) ==================== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: var(--card-pad);
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .card.is-hidden {
      border-style: dashed;
      opacity: 0.88;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-id {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }

    .card-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--surface-3);
      display: grid;
      place-items: center;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-thumb.contain {
      background: var(--surface-2);
      padding: 4px;
    }
    .card-thumb.contain img { object-fit: contain; }

    .card-titles { min-width: 0; }

    .card-title {
      margin: 0;
      font-size: var(--fs-title);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--ink);
      word-break: break-word;
    }

    .card-sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }

    .badge {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      line-height: 1.2;
    }

    .badge.thor  { background: var(--blue-soft);  color: var(--blue);  border: 1px solid var(--blue-line); }
    .badge.thor2 { background: var(--cyan-soft);  color: var(--cyan);  border: 1px solid var(--cyan-line); }
    .badge.thor4 { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-line); }
    .badge.orin  { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-line); }
    .badge.ctx   { background: var(--surface-2);  color: var(--ink-2); border: 1px solid var(--line); }
    .badge.new   { background: var(--rose-soft);  color: var(--rose);  border: 1px solid var(--rose-line); }
    .badge.beta  { background: var(--violet-soft);color: var(--violet);border: 1px solid var(--violet-line); }

    /* Highlight Summary Bar (Light Benchmark Quant Pill) */
    .perf-strip {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-left: 3px solid var(--blue);
      border-radius: 4px;
      padding: 9px 12px;
      font-size: var(--fs-desc);
      color: var(--ink-2);
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .perf-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .perf-tag {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    .perf-tag.thor { background: var(--blue-soft); color: var(--blue); }
    .perf-tag.orin { background: var(--amber-soft); color: var(--amber); }

    .perf-text {
      color: var(--ink);
      font-weight: 500;
      word-break: break-word;
    }

    .perf-text.muted {
      color: var(--ink-2);
      font-weight: 400;
    }

    /* 3-Column Hardcore Metrics Grid */
    .tri-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .tri-box {
      background: var(--surface);
      padding: 11px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 3px;
    }

    .tri-box.primary {
      background: color-mix(in srgb, var(--blue-soft) 45%, var(--surface));
    }

    .tri-val {
      font-size: var(--fs-metric);
      font-weight: 800;
      color: var(--ink);
      line-height: 1.15;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .tri-box.primary .tri-val { color: var(--blue); }
    .tri-box.accent-green .tri-val { color: var(--green); }

    .tri-lbl {
      font-size: var(--fs-metric-lbl);
      font-weight: 600;
      color: var(--ink-3);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Card Footer */
    .card-foot {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11.5px;
      color: var(--ink-3);
    }

    .foot-hw {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .foot-action {
      color: var(--blue);
      font-weight: 700;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .speedup-tag {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 700;
      background: var(--green-soft);
      color: var(--green);
      border: 1px solid var(--green-line);
      padding: 1px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }

    /* ==================== Spec Board View (Table List) ==================== */
    .spec-board {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }

    .spec-board-head {
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) minmax(200px, 0.95fr) minmax(280px, 1.85fr) 74px;
      gap: 14px;
      padding: 11px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line-strong);
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    .spec-row {
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) minmax(200px, 0.95fr) minmax(280px, 1.85fr) 74px;
      gap: 14px;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background 0.14s;
    }

    .spec-row:last-child { border-bottom: 0; }
    .spec-row:hover { background: var(--surface-2); }

    .spec-name-cell {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .spec-mini-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--surface-3);
      flex-shrink: 0;
    }
    .spec-mini-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .spec-title {
      font-size: calc(var(--fs-title) - 1.5px);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .spec-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .spec-hw-lines {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--ink-2);
    }

    .spec-hw-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .spec-desc {
      margin: 0;
      font-size: var(--fs-desc);
      color: var(--ink-2);
      line-height: 1.55;
      white-space: pre-line;
    }

    .spec-go {
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      white-space: nowrap;
    }

    /* ==================== Overview Wall View (3-Col Compact) ==================== */
    .wall-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .wall-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-xs);
    }

    .wall-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .wall-head-l {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .wall-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--ink);
    }

    .wall-cnt {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--ink-2);
    }

    .wall-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wall-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid transparent;
      cursor: pointer;
      transition: border-color 0.14s, background 0.14s;
    }

    .wall-item:hover {
      border-color: var(--blue-line);
      background: var(--blue-soft);
    }

    .wall-item-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    .wall-item-hw {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-3);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ==================== Category Accent Colors ==================== */
    .bar-blue    { background: #2563eb; }
    .bar-violet  { background: #7c3aed; }
    .bar-rose    { background: #e11d48; }
    .bar-emerald { background: #059669; }
    .bar-amber   { background: #d97706; }
    .bar-cyan    { background: #0284c7; }
    .bar-slate   { background: #475569; }

    /* ==================== Footnote ==================== */
    .footnote {
      margin-top: 32px;
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--ink-3);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 18px;
    }

    /* ==================== Detail & Changelog Modals ==================== */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 720px;
      max-height: 86vh;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      box-shadow: 0 24px 60px -12px rgba(15, 23, 42, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: fadeUp 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-head {
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }

    .modal-body {
      padding: 20px 22px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-cover {
      width: 100%;
      aspect-ratio: 16 / 7.5;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--surface-3);
      position: relative;
    }
    .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-cover.contain { background: var(--surface-2); padding: 14px; }
    .detail-cover.contain img { object-fit: contain; }

    .detail-section-label {
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 6px;
    }

    .detail-hw-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }

    .detail-hw-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-hw-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 13.5px;
      color: var(--ink);
    }

    .detail-hw-nums {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: var(--ink-2);
    }

    .detail-hw-profile {
      font-size: 11.5px;
      color: var(--ink-3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 8px;
      word-break: break-word;
    }

    .detail-note {
      font-size: 12.5px;
      color: var(--ink-2);
      line-height: 1.65;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .detail-pkg {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 12px;
      color: var(--ink-3);
    }

    .log-entry {
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .log-top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13.5px;
      font-weight: 700;
    }
    .log-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .log-chip { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .log-add { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-line); }
    .log-upd { background: var(--blue-soft); color: var(--blue); border: 1px solid var(--blue-line); }
    .log-rem { background: var(--rose-soft); color: var(--rose); border: 1px solid var(--rose-line); }

    /* ==================== Screenshot Mode ==================== */
    body.screenshot-mode .topbar,
    body.screenshot-mode .controls-shell,
    body.screenshot-mode .update-banner { display: none !important; }
    body.screenshot-mode .wrap { padding-top: 20px; padding-bottom: 36px; }

    .shot-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 60;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    body.screenshot-mode .shot-float { display: inline-flex; }
    .shot-float button {
      border: 0;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .shot-float button:hover { background: rgba(255, 255, 255, 0.25); }
    .shot-float button.exit { background: #2563eb; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(14px);
      background: #0f172a;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 95;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 48px 20px;
      text-align: center;
      color: var(--ink-3);
      font-size: 15px;
    }

    /* ==================== Force Sync Button & 5s Result Popup ==================== */
    @keyframes spin360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .btn-sync {
      border-color: var(--blue-line);
      background: var(--blue-soft);
      color: var(--blue);
    }

    .btn-sync:hover:not(:disabled) {
      border-color: var(--blue);
      background: color-mix(in srgb, var(--blue-soft) 80%, var(--blue) 12%);
      color: var(--blue);
    }

    .btn-sync:disabled {
      opacity: 0.72;
      cursor: wait;
    }

    .btn-sync svg {
      width: 13.5px;
      height: 13.5px;
      flex-shrink: 0;
    }

    .btn-sync.loading svg {
      animation: spin360 0.8s linear infinite;
    }

    .sync-popup {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px) scale(0.98);
      width: min(470px, calc(100vw - 24px));
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      backdrop-filter: saturate(180%) blur(18px);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      box-shadow: 0 20px 50px -14px rgba(15, 23, 42, 0.24), 0 4px 14px -4px rgba(15, 23, 42, 0.08);
      z-index: 96;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1), transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sync-popup.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .sync-pop-inner {
      padding: 14px 16px 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sync-pop-head {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .sync-pop-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .sync-pop-icon.updated { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-line); }
    .sync-pop-icon.none    { background: var(--blue-soft);  color: var(--blue);  border: 1px solid var(--blue-line); }
    .sync-pop-icon.error   { background: var(--rose-soft);  color: var(--rose);  border: 1px solid var(--rose-line); }

    .sync-pop-main {
      flex: 1;
      min-width: 0;
    }

    .sync-pop-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .sync-pop-title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
    }

    .sync-pop-sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--ink-3);
      line-height: 1.45;
    }

    .sync-pop-ctrl {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sync-pop-cd {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-3);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .sync-pop-close {
      border: 0;
      background: transparent;
      color: var(--ink-3);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: grid;
      place-items: center;
    }
    .sync-pop-close:hover { background: var(--surface-3); color: var(--ink); }

    .sync-pop-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sync-pop-list {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 185px;
      overflow-y: auto;
    }

    .sync-pop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      line-height: 1.35;
    }

    .sync-pop-item-l {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .sync-pop-item-name {
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-pop-more {
      font-size: 11.5px;
      color: var(--ink-3);
      padding-top: 2px;
      border-top: 1px dashed var(--line);
    }

    .sync-pop-bar {
      height: 3px;
      width: 100%;
      background: var(--surface-3);
      overflow: hidden;
    }

    .sync-pop-bar-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transition: transform 0.1s linear;
    }

    .sync-pop-bar-fill.updated { background: var(--green); }
    .sync-pop-bar-fill.none    { background: var(--blue); }
    .sync-pop-bar-fill.error   { background: var(--rose); }

    /* ==================== Responsive Adaptation ==================== */
    @media (max-width: 1080px) {
      .page-head { grid-template-columns: 1fr; gap: 16px; }
      .head-stamp { text-align: left; }
      .wall-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 860px) {
      .cards-grid { grid-template-columns: 1fr; }
      .spec-board-head { display: none; }
      .spec-row { grid-template-columns: 1fr; gap: 8px; padding: 14px; }
      .spec-go { text-align: left; }
      .wall-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .wrap { padding: 16px 14px 48px; }
      .topbar-inner { padding: 0 14px; }
      .kpi-strip { grid-template-columns: repeat(3, 1fr); }
      .kpi-cell { padding: 9px 10px; min-width: 0; }
      .kpi-val { font-size: 18px; }
      .search-box { width: 100%; }
      .toolbar-left, .toolbar-right { width: 100%; }
      .pills-bar { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .pills-bar::-webkit-scrollbar { display: none; }
      .pill { flex-shrink: 0; }
      .card { padding: 16px; gap: 12px; }
      .card-thumb { width: 42px; height: 42px; }
      .tri-val { font-size: 15px; }
      .tri-lbl { font-size: 10.5px; }
    }

    @media print {
      .topbar, .controls-shell, .update-banner, .shot-float, .sync-popup, .toast { display: none !important; }
      body { background: #ffffff; background-image: none; }
      .card, .wall-card, .spec-board { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="top-brand" id="nav-back" href="../">
        <img src="../assets/favicon.png" alt="LazyCat" />
        <span id="top-brand-name">懒猫微服 · 模型广场</span>
        <small>AI POD</small>
      </a>
      <div class="top-right">
        <div class="seg" id="lang-seg-wrap" role="group" aria-label="Language">
          <button type="button" data-lang="zh" class="active">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="btn" id="btn-theme" title="Theme">🌓</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Editorial Page Header -->
    <section class="page-head" id="hero">
      <div>
        <div class="kicker-row">
          <span class="kicker"><span class="live-dot"></span><span id="hero-badge-text">AI POD MODEL STORE · OFFICIAL CATALOG</span></span>
          <span class="ver-pill num" id="meta-version">v--</span>
          <span class="filter-tag" id="hero-filter-label"></span>
        </div>
        <h1 id="hero-title">懒猫 AI Pod 模型广场 · 实测支持一览</h1>
        <p class="page-sub" id="hero-sub">涵盖大语言模型、视频/图像生成、实时语音、文档 OCR 与多模态检索，本地一键部署，点击任意卡片查看完整硬件与实测参数。</p>
      </div>

      <div>
        <div class="kpi-strip">
          <div class="kpi-cell">
            <span class="kpi-val blue num" id="stat-visible">--</span>
            <span class="kpi-lbl" id="lbl-stat-visible">展示模型</span>
          </div>
          <div class="kpi-cell">
            <span class="kpi-val num" id="stat-cats">--</span>
            <span class="kpi-lbl" id="lbl-stat-cats">能力分类</span>
          </div>
          <div class="kpi-cell">
            <span class="kpi-val cyan num" id="stat-thor">--</span>
            <span class="kpi-lbl" id="lbl-stat-thor">AGX Thor</span>
          </div>
          <div class="kpi-cell">
            <span class="kpi-val amber num" id="stat-orin">--</span>
            <span class="kpi-lbl" id="lbl-stat-orin">AGX Orin</span>
          </div>
          <div class="kpi-cell">
            <span class="kpi-val green num" id="stat-multi">--</span>
            <span class="kpi-lbl" id="lbl-stat-multi">多机集群</span>
          </div>
        </div>
        <div class="head-stamp num" id="meta-stamp">--</div>
      </div>
    </section>

    <section class="update-banner" id="update-banner"></section>

    <!-- Controls & Filter Bar -->
    <section class="controls-shell">
      <div class="toolbar-row">

      function detectInitialLang() {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('lang');
        if (q === 'en' || q === 'zh') return q;
        const saved = localStorage.getItem('lcmd-lang');
        if (saved === 'en' || saved === 'zh') return saved;
        return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      }

      const urlParams = new URLSearchParams(window.location.search);
      const isEmbed = urlParams.get('embed') === '1';
      if (isEmbed) document.body.classList.add('embed-mode');

      const state = {
        data: null,
        lang: detectInitialLang(),
        view: localStorage.getItem('ms-view') || 'cards',
        scale: localStorage.getItem('ms-scale') || 'normal',
        theme: urlParams.get('theme') || localStorage.getItem('lcmd-theme') || 'light',
        category: 'all',
        hw: 'all',
        query: '',
        showHidden: false,
        screenshotMode: false,
        syncing: false,
      };

      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));
      const t = () => I18N[state.lang];
      const isEn = () => state.lang === 'en';

      function showToast(msg) {
        const el = $('#toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatGiB(v) {
        if (typeof v !== 'number' || Number.isNaN(v)) return '--';
        if (v < 0.1) return Math.round(v * 1024) + 'M';
        const rounded = Math.round(v * 10) / 10;
        return (Number.isInteger(rounded) ? rounded : rounded.toFixed(1)) + 'G';
      }

      function fmtCompactNum(n) {
        if (!Number.isFinite(n)) return '--';
        if (n >= 10000) return Math.round(n).toLocaleString('en-US');
        if (n >= 1000) return Math.round(n).toLocaleString('en-US');
        if (n >= 100) return n.toFixed(1).replace(/\.0$/, '');
        if (n >= 10) return n.toFixed(1).replace(/\.0$/, '');
        return n.toFixed(2).replace(/0$/, '').replace(/\.$/, '');
      }

      function modelTitle(m) { return isEn() ? (m.titleEn || m.title) : m.title; }
      function modelDesc(m) { return isEn() ? (m.descriptionEn || m.description) : m.description; }
      function catName(cat) { return isEn() ? (cat.en || cat.zh) : cat.zh; }
      function catSub(cat) { return isEn() ? cat.zh : cat.en; }
      function modelCatLabel(m) { return isEn() ? (m.categoryShortEn || m.categoryEn || m.categoryZh) : m.categoryZh; }

      // ==================== Intelligent Metric & Benchmark Parser ====================
      function splitHwDesc(rawText) {
        const clean = String(rawText || '').trim();
        const lines = clean.split(/\n+/).map((s) => s.trim()).filter(Boolean);
        let thorLine = '';
        let orinLine = '';
        const otherLines = [];

        for (const ln of lines) {
          if (/^(?:AGX\s+)?Thor(?:\s+T\d+)?[：:]/i.test(ln)) {
            thorLine = ln.replace(/^(?:AGX\s+)?Thor(?:\s+T\d+)?[：:]\s*/i, '').trim();
          } else if (/^(?:AGX\s+)?Orin[：:]/i.test(ln)) {
            orinLine = ln.replace(/^(?:AGX\s+)?Orin[：:]\s*/i, '').trim();
          } else {
            otherLines.push(ln);
          }
        }
        return { thorLine, orinLine, otherText: otherLines.join(' · ') };
      }

      function extractContextBadge(m) {
        const text = `${m.description || ''} ${m.hardware?.[0]?.profile || ''}`;
        const hit = text.match(/(\d+(?:\.\d+)?[KM])\s*(?:上下文|context)/i);
        if (hit) return `${hit[1].toUpperCase()} CTX`;
        const tok = text.match(/\b(1048576|900000|262144|131072|32768|8192)\s*tokens\b/i);
        if (tok) {
          const v = Number(tok[1]);
          if (v >= 1000000) return '1M CTX';
          return `${Math.round(v / 1024)}K CTX`;
        }
        return '';
      }

      function extractNumber(str) {
        if (!str) return null;
        const n = parseFloat(String(str).replace(/,/g, ''));
        return Number.isFinite(n) ? n : null;
      }

      function parseSpeedValMs(text) {
        const mMs = text.match(/(\d+(?:\.\d+)?)(?:\/\d+(?:\.\d+)?)*\s*ms\b/i);
        if (mMs) return parseFloat(mMs[1]);
        const mDur = text.match(/(?:耗时|完整生成|生图|转写|分离|译中文|短句|整句|短文|长文|首音|编辑|两页)[^\d]{0,14}(\d+(?:\.\d+)?)(?:\/\d+(?:\.\d+)?)*\s*s\b/i);
        if (mDur) return parseFloat(mDur[1]) * 1000;
        const mSlashS = text.match(/(\d+(?:\.\d+)?)s\/\d+(?:\.\d+)?s/i);
        if (mSlashS) return parseFloat(mSlashS[1]) * 1000;
        const mPerImg = text.match(/(\d+(?:\.\d+)?)\s*s\/张/i);
        if (mPerImg) return parseFloat(mPerImg[1]) * 1000;
        return null;
      }

      function extractTriMetrics(m) {
        const L = t();
        const zhDesc = m.description || '';
        const { thorLine, orinLine, otherText } = splitHwDesc(zhDesc);
        const primaryText = thorLine || otherText || zhDesc;

        const thorHw = (m.hardware || []).find((h) => h.device === 'thor') || m.hardware?.[0] || null;
        const orinHw = (m.hardware || []).find((h) => h.device === 'orin') || null;
        const activeHw = state.hw === 'orin' && orinHw ? orinHw : thorHw || orinHw;

        const vramVal = activeHw ? `${formatGiB(activeHw.memoryGiB)}` : renderShortHw(m);
        const vramLbl = activeHw
          ? activeHw.cpuOnly
            ? L.lblRam
            : activeHw.perDevice && m.deviceCount > 1
              ? L.lblVramPerNode
              : L.lblVram
          : isEn() ? 'Supported HW' : '支持硬件';
        const diskOp = activeHw?.diskLowerBound ? '≥' : '';
        const diskVal = activeHw ? `${diskOp}${formatGiB(activeHw.diskGiB)}` : isEn() ? 'Modular' : '按需加载';
        const diskLbl = activeHw
          ? activeHw.perDevice && m.deviceCount > 1 ? L.lblDiskPerNode : L.lblDisk
          : isEn() ? 'Model Assets' : '权重模式';

        let speedup = '';

        // 1. LLM Metrics Extraction
        if (m.category === 'llm') {
          const focusText = state.hw === 'orin' && orinLine ? orinLine : primaryText;

          let decodeVal = '';
          let decodeNum = null;
          const mDec =
            focusText.match(/(?:代码单流|单流)[^\d]{0,12}(?:\d+(?:\.\d+)?[–-])?(\d+(?:\.\d+)?)\s*TPS/i) ||
            focusText.match(/(\d+(?:\.\d+)?)\s*TPS/i);
          if (mDec) {
            decodeNum = extractNumber(mDec[1]);
            decodeVal = `${fmtCompactNum(decodeNum)} TPS`;
          }

          let prefillVal = '';
          let prefillLbl = L.lblPrefill;
          const mPre = focusText.match(/(\d+K(?:\/\d+K)?)?\s*Prefill[^\d]{0,10}(?:\d+(?:\.\d+)?\/)?(\d+(?:\.\d+)?)\s*TPS/i);
          if (mPre) {
            const pNum = extractNumber(mPre[2]);
            prefillVal = `${fmtCompactNum(pNum)} TPS`;
            if (mPre[1]) prefillLbl = `${mPre[1].split('/').pop()} Prefill`;
          } else {
            const mConc = focusText.match(/(\d+)\s*并发[^\d]{0,10}(?:\d+(?:\.\d+)?[–\/-])?(\d+(?:\.\d+)?)\s*TPS/i);
            const mTtft = focusText.match(/TTFT[^\d]{0,8}(\d+(?:\.\d+)?)\s*(ms|s)/i);
            if (mConc) {
              prefillVal = `${fmtCompactNum(extractNumber(mConc[2]))} TPS`;
              prefillLbl = isEn() ? `${mConc[1]}-Way TPS` : `${mConc[1]} 并发吞吐`;
            } else if (mTtft) {
              prefillVal = `${mTtft[1]}${mTtft[2]}`;
              prefillLbl = L.lblTtft;
            }
          }

          if (thorLine && orinLine && state.hw !== 'orin') {
            const tDec = thorLine.match(/(?:代码单流|单流)[^\d]{0,12}(?:\d+(?:\.\d+)?[–-])?(\d+(?:\.\d+)?)\s*TPS/i);
            const oDec = orinLine.match(/(?:代码单流|单流)[^\d]{0,12}(?:\d+(?:\.\d+)?[–-])?(\d+(?:\.\d+)?)\s*TPS/i);
            if (tDec && oDec) {
              const r = parseFloat(tDec[1]) / parseFloat(oDec[1]);
              if (r >= 1.35) speedup = L.speedupTag(r.toFixed(1));
            }
          }

          if (decodeVal && prefillVal) {
            return {
              speedup,
              boxes: [
                { val: decodeVal, lbl: L.lblDecode, cls: 'primary' },
                { val: prefillVal, lbl: prefillLbl, cls: '' },
                { val: vramVal, lbl: vramLbl, cls: '' },
              ],
            };
          }
          if (decodeVal) {
            return {
              speedup,
              boxes: [
                { val: decodeVal, lbl: L.lblDecode, cls: 'primary' },
                { val: vramVal, lbl: vramLbl, cls: '' },
                { val: diskVal, lbl: diskLbl, cls: '' },
              ],
            };
          }
        }

        // 2. Non-LLM Metrics Extraction
        const focusText = state.hw === 'orin' && orinLine ? orinLine : primaryText;
        let metric1Val = '';
        let metric1Lbl = state.hw === 'orin' && orinLine ? L.lblOrinSpeed : L.lblSpeed;

        const mRtf = focusText.match(/(\d+(?:\.\d+)?)\s*倍实时/);
        const mRate = focusText.match(/(\d+(?:\.\d+)?)(?:\/\d+(?:\.\d+)?)*\s*(张\/s|条\/s)/);
        const mImg = focusText.match(/(\d+(?:\.\d+)?)\s*s\/张/);
        const mTps = focusText.match(/(\d+(?:\.\d+)?)(?:\/\d+(?:\.\d+)?)*\s*TPS/i);
        const mVidDur = m.category === 'video' && focusText.match(/(?:耗时|完整生成)\s*(\d+(?:\.\d+)?)(?:\/\d+(?:\.\d+)?)*s?/);
        const mDual = focusText.match(/双路吞吐\s*(\d+(?:\.\d+)?)x/i);
        const mMs = focusText.match(/(\d+(?:\.\d+)?)(?:\/\d+(?:\.\d+)?)*\s*ms\b/i);
        const mSlashSec = focusText.match(/(\d+(?:\.\d+)?)s\/\d+(?:\.\d+)?s/i);
        const mTimeS = focusText.match(/(?:耗时|完整生成|生图|转写|分离|译中文|短句|整句|短文|长文|首音)[^\d]{0,14}(\d+(?:\.\d+)?)\s*s\b/);

        if (mRtf) {
          metric1Val = `${mRtf[1]}× RT`;
          metric1Lbl = isEn() ? 'Realtime Factor' : '实时倍率';
        } else if (mRate) {
          const unit = mRate[2] === '张/s' ? (isEn() ? ' img/s' : ' 张/s') : (isEn() ? ' req/s' : ' 条/s');
          metric1Val = `${mRate[1]}${unit}`;
          metric1Lbl = L.lblPerf;
        } else if (mImg) {
          metric1Val = `${mImg[1]}s`;
          metric1Lbl = isEn() ? 'Per Image' : '单张耗时';
        } else if (mVidDur) {
          metric1Val = `${mVidDur[1]}s`;
          metric1Lbl = isEn() ? 'Video Gen' : '视频生成耗时';
        } else if (mDual) {
          metric1Val = `${mDual[1]}×`;
          metric1Lbl = isEn() ? 'Dual Throughput' : '双路实时吞吐';
        } else if (mTps) {
          metric1Val = `${mTps[1]} TPS`;
          metric1Lbl = L.lblPerf;
        } else if (mMs) {
          metric1Val = `${mMs[1]}ms`;
          metric1Lbl = isEn() ? 'Latency' : '单次耗时';
        } else if (mSlashSec) {
          metric1Val = `${mSlashSec[1]}s`;
          metric1Lbl = isEn() ? 'Elapsed Time' : '单次耗时';
        } else if (mTimeS) {
          metric1Val = `${mTimeS[1]}s`;
          metric1Lbl = isEn() ? 'Elapsed Time' : '实测耗时';
        } else {
          metric1Val = L.valOneClick;
          metric1Lbl = L.lblDeploy;
        }

        if (thorLine && orinLine && state.hw !== 'orin') {
          const tMs = parseSpeedValMs(thorLine);
          const oMs = parseSpeedValMs(orinLine);
          if (tMs && oMs && oMs / tMs >= 1.35) {
            speedup = L.speedupTag((oMs / tMs).toFixed(1));
          } else {
            const tR = thorLine.match(/(\d+(?:\.\d+)?)(?:\/\d+(?:\.\d+)?)*\s*(?:倍实时|张\/s|条\/s|TPS)/i);
            const oR = orinLine.match(/(\d+(?:\.\d+)?)(?:\/\d+(?:\.\d+)?)*\s*(?:倍实时|张\/s|条\/s|TPS)/i);
            if (tR && oR && parseFloat(tR[1]) / parseFloat(oR[1]) >= 1.35) {
              speedup = L.speedupTag((parseFloat(tR[1]) / parseFloat(oR[1])).toFixed(1));
            }
          }
        }

        return {
          speedup,
          boxes: [
            { val: metric1Val, lbl: metric1Lbl, cls: 'primary' },
            { val: vramVal, lbl: vramLbl, cls: '' },
            { val: diskVal, lbl: diskLbl, cls: '' },
          ],
        };
      }

      function renderHwBadges(m) {
        const L = t();
        const out = [];
        if (m.devices.includes('thor')) {
          if (m.deviceCount >= 4) out.push(`<span class="badge thor4">Thor ×${m.deviceCount}</span>`);
          else if (m.deviceCount >= 2) out.push(`<span class="badge thor2">Thor ×${m.deviceCount}</span>`);
          else out.push(`<span class="badge thor">Thor</span>`);
        }
        if (m.devices.includes('orin')) {
          out.push(`<span class="badge orin">Orin</span>`);
        }
        const ctx = extractContextBadge(m);
        if (ctx) out.push(`<span class="badge ctx">${esc(ctx)}</span>`);
        if (m.isNew) out.push(`<span class="badge new">${esc(L.newBadge)}</span>`);
        if (m.hidden) out.push(`<span class="badge beta">${esc(L.hiddenBadge)}</span>`);
        return out.join('');
      }

      function renderPerfStrip(m) {
        const text = modelDesc(m);
        const { thorLine, orinLine, otherText } = splitHwDesc(text);
        if (thorLine || orinLine) {
          const rows = [];
          if (thorLine && state.hw !== 'orin') {
            rows.push(`<div class="perf-line"><span class="perf-tag thor">THOR</span><span class="perf-text">${esc(thorLine)}</span></div>`);
          }
          if (orinLine) {
            rows.push(`<div class="perf-line"><span class="perf-tag orin">ORIN</span><span class="perf-text ${state.hw === 'orin' ? '' : 'muted'}">${esc(orinLine)}</span></div>`);
          }
          if (otherText) {
            rows.push(`<div class="perf-line"><span class="perf-text muted">${esc(otherText)}</span></div>`);
          }
          return `<div class="perf-strip">${rows.join('')}</div>`;
        }
        return `<div class="perf-strip"><div class="perf-line"><span class="perf-text">${esc(text)}</span></div></div>`;
      }

      function renderCompactFootHw(m) {
        const L = t();
        const list = m.hardware || [];
        if (!list.length) return esc(m.meta || 'AGX');
        return list
          .map((h) => {
            const dev = h.device === 'thor'
              ? (h.perDevice && m.deviceCount > 1 ? `Thor×${m.deviceCount}` : 'Thor')
              : 'Orin';
            const per = h.perDevice && m.deviceCount > 1 ? L.perNode : '';
            const diskOp = h.diskLowerBound ? '≥' : '';
            return `${dev} ${formatGiB(h.memoryGiB)} / ${diskOp}${formatGiB(h.diskGiB)}${per}`;
          })
          .join('  ·  ');
      }

      function renderShortHw(m) {
        const parts = [];
        if (m.devices.includes('thor')) parts.push(m.deviceCount > 1 ? `Thor ×${m.deviceCount}` : 'Thor');
        if (m.devices.includes('orin')) parts.push('Orin');
        return parts.join(' / ') || m.meta || '';

      function matchesHw(m, hw) {
        if (hw === 'all') return true;
        if (hw === 'thor-single') return m.devices.includes('thor') && !m.isMultiNode;
        if (hw === 'thor-multi') return m.devices.includes('thor') && m.isMultiNode;
        if (hw === 'orin') return m.devices.includes('orin');
        return true;
      }

      function getBaseModels() {
        if (!state.data) return [];
        return state.data.models.filter((m) => (state.showHidden ? true : !m.hidden));
      }

      function getFilteredModels() {
        const q = state.query.trim().toLowerCase();
        return getBaseModels().filter((m) => {
          if (state.category !== 'all' && m.category !== state.category) return false;
          if (!matchesHw(m, state.hw)) return false;
          if (q) {
            const hay = [
              m.title,
              m.titleEn,
              m.categoryZh,
              m.categoryEn,
              m.meta,
              m.description,
              m.descriptionEn,
              m.packageId,
              m.badge,
              ...(m.hardware || []).map((h) => `${h.device} ${h.profile}`),
            ]
              .join(' ')
              .toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function renderCategoryChips() {
        const L = t();
        const base = getBaseModels().filter((m) => matchesHw(m, state.hw));
        const counts = {};
        for (const m of base) counts[m.category] = (counts[m.category] || 0) + 1;

        const chips = [
          `<button type="button" class="pill ${state.category === 'all' ? 'active' : ''}" data-cat="all">${esc(L.allModels)} <span class="cnt num">${base.length}</span></button>`,
        ];
        for (const cat of state.data.categories) {
          const c = counts[cat.key] || 0;
          if (!c) continue;
          chips.push(
            `<button type="button" class="pill ${state.category === cat.key ? 'active' : ''}" data-cat="${esc(cat.key)}">${esc(catName(cat))} <span class="cnt num">${c}</span></button>`,
          );
        }
        $('#cat-chips').innerHTML = chips.join('');
        $$('#cat-chips .pill').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.category = btn.dataset.cat;
            render();
