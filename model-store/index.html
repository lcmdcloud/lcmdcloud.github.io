<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCMD AI Pod 模型广场 · Model Store</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 11.5L16 8l7 3.5v9L16 24l-7-3.5v-9z' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffffff'/%3E%3C/svg%3E"
  />
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-muted: #eef2f7;
      --border: #dfe5ef;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px -8px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;

      /* Typography Scale (default = large for customer screenshots) */
      --fs-hero: 36px;
      --fs-sub: 17px;
      --fs-stat: 32px;
      --fs-stat-label: 14.5px;
      --fs-sec: 25px;
      --fs-title: 21px;
      --fs-desc: 16.5px;
      --fs-meta: 14.5px;
      --fs-pill: 14px;
      --card-min: 400px;
      --card-pad: 22px;
      --grid-gap: 20px;
      --cover-ratio: 16 / 8.2;
    }

    html[data-scale="normal"] {
      --fs-hero: 30px;
      --fs-sub: 15px;
      --fs-stat: 26px;
      --fs-stat-label: 13px;
      --fs-sec: 21px;
      --fs-title: 18px;
      --fs-desc: 14.5px;
      --fs-meta: 13px;
      --fs-pill: 12.5px;
      --card-min: 340px;
      --card-pad: 18px;
      --grid-gap: 16px;
      --cover-ratio: 16 / 8.5;
    }

    html[data-scale="xlarge"] {
      --fs-hero: 42px;
      --fs-sub: 19px;
      --fs-stat: 38px;
      --fs-stat-label: 16px;
      --fs-sec: 29px;
      --fs-title: 24px;
      --fs-desc: 18.5px;
      --fs-meta: 16px;
      --fs-pill: 15.5px;
      --card-min: 480px;
      --card-pad: 26px;
      --grid-gap: 24px;
      --cover-ratio: 16 / 7.8;
    }

    html.dark {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-soft: #182131;
      --surface-muted: #1e293b;
      --border: #263348;
      --border-strong: #364762;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.16);
      --primary-border: rgba(96, 165, 250, 0.35);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 28px -8px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html {
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    @keyframes msFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #content {
      animation: msFadeIn 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1560px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .nav-back:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .seg {
      display: inline-flex;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .seg button {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .seg button.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--border-strong);
      background: var(--surface-soft);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    .container {
      max-width: 1560px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 32px;
      box-shadow: var(--shadow-md);
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, #2563eb 0%, #7c3aed 50%, #059669 100%);
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .hero-brand {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 920px;
    }

    .hero-eyebrow {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      color: var(--primary);
      font-size: 13.5px;
      font-weight: 700;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
    }

    .hero h1 {
      margin: 0;
      font-size: var(--fs-hero);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text);
    }

    .hero-sub {
      margin: 0;
      font-size: var(--fs-sub);
      color: var(--text-secondary);
      font-weight: 500;
    }

    .hero-meta-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      text-align: right;
      font-size: 14.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .hero-version {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 10px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .stat-card {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-num {
      font-size: var(--fs-stat);
      font-weight: 800;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .stat-num.blue { color: #2563eb; }
    .stat-num.violet { color: #7c3aed; }
    .stat-num.emerald { color: #059669; }
    .stat-num.amber { color: #d97706; }

    html.dark .stat-num.blue { color: #60a5fa; }
    html.dark .stat-num.violet { color: #a78bfa; }
    html.dark .stat-num.emerald { color: #34d399; }
    html.dark .stat-num.amber { color: #fbbf24; }

    .stat-label {
      font-size: var(--fs-stat-label);
      color: var(--text-secondary);
      font-weight: 600;
    }

    .filters-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 22px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 280px;
      max-width: 440px;
    }

    .search-input {
      width: 100%;
      padding: 10px 38px 10px 16px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 15.5px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: var(--surface-muted);
      color: var(--text-secondary);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .search-clear.show { display: inline-flex; }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-secondary);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }

    .chip.active {
      background: var(--text);
      color: var(--surface);
      border-color: var(--text);
    }

    .chip-count {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      opacity: 0.78;
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      margin-left: auto;
    }

    .update-banner {
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      color: var(--text);
    }

    .cat-section { margin-bottom: 34px; }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .cat-dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .cat-title {
      margin: 0;
      font-size: var(--fs-sec);
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--text);
    }

    .cat-en {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .cat-count {
      margin-left: auto;
      padding: 4px 13px;
      border-radius: 999px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      gap: var(--grid-gap);
    }

    .model-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .model-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .model-card.is-hidden-card {
      border-style: dashed;
      opacity: 0.86;
    }

    .cover {
      position: relative;
      width: 100%;
      aspect-ratio: var(--cover-ratio);
      background: #0f172a;
      overflow: hidden;
      flex-shrink: 0;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover.cover-contain {
      background: #f8fafc;
      padding: 14px;
    }

    html.dark .cover.cover-contain { background: #0f172a; }
    .cover.cover-contain img { object-fit: contain; }

    .cover-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 24px;
      color: #ffffff;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.55) 0%, rgba(15, 23, 42, 0.12) 100%);
      pointer-events: none;
    }

    .cover-overlay strong {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }

    .cover-overlay strong.compact { font-size: 22px; }

    .cover-overlay span {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      opacity: 0.92;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }

    .cover-badges {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }

    .pill-float {
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .pill-new {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
    }

    .pill-tag {
      background: rgba(15, 23, 42, 0.78);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .card-body {
      padding: var(--card-pad);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      margin: 0;
      font-size: var(--fs-title);
      font-weight: 800;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }

    .cat-pill {
      flex-shrink: 0;
      padding: 4px 11px;
      border-radius: 8px;
      font-size: var(--fs-pill);
      font-weight: 700;
      white-space: nowrap;
    }

    .hw-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hw-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: var(--fs-meta);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.35;
    }

    .hw-thor { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }
    .hw-thor-multi { background: #f5f3ff; color: #5b21b6; border: 1px solid #ddd6fe; }
    .hw-orin { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }

    html.dark .hw-thor { background: rgba(99, 102, 241, 0.16); color: #c7d2fe; border-color: rgba(129, 140, 248, 0.35); }
    html.dark .hw-thor-multi { background: rgba(139, 92, 246, 0.18); color: #ddd6fe; border-color: rgba(167, 139, 250, 0.38); }
    html.dark .hw-orin { background: rgba(16, 185, 129, 0.15); color: #a7f3d0; border-color: rgba(52, 211, 153, 0.35); }

    .hw-dev { font-weight: 800; }
    .hw-sep { opacity: 0.45; }

    .card-desc {
      margin: 0;
      font-size: var(--fs-desc);
      line-height: 1.65;
      color: var(--text-secondary);
      white-space: pre-line;
      word-break: break-word;
    }

    .list-table {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .list-row {
      display: grid;
      grid-template-columns: minmax(240px, 1.3fr) minmax(240px, 1.15fr) minmax(300px, 2fr);
      gap: 18px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }
    .list-row:last-child { border-bottom: 0; }
    .list-row:nth-child(even) { background: var(--surface-soft); }

    .list-title-wrap { display: flex; flex-direction: column; gap: 6px; }
    .list-title { font-size: var(--fs-title); font-weight: 800; color: var(--text); line-height: 1.3; }
    .list-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .wall-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 18px;
    }

    .wall-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .wall-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid var(--border);
    }

    .wall-head-left { display: flex; align-items: center; gap: 10px; }
    .wall-title { font-size: calc(var(--fs-title) + 1px); font-weight: 800; color: var(--text); }
    .wall-count { padding: 3px 11px; border-radius: 999px; font-size: 14px; font-weight: 800; white-space: nowrap; }
    .wall-items { display: flex; flex-direction: column; gap: 10px; }

    .wall-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
    }

    .wall-item-name { font-size: calc(var(--fs-desc) + 0.5px); font-weight: 700; color: var(--text); line-height: 1.35; }
    .wall-item-hw {
      flex-shrink: 0;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }

    .footer {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    body.screenshot-mode .topbar,
    body.screenshot-mode .filters-panel,
    body.screenshot-mode .update-banner { display: none !important; }
    body.screenshot-mode .container { padding-top: 24px; padding-bottom: 36px; }

      right: 22px;
      bottom: 22px;
      z-index: 60;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .shot-float button {
      border: 0;
      background: rgba(255, 255, 255, 0.14);

      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%;
      max-width: 720px;
      max-height: 82vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h3 { margin: 0; font-size: 20px; font-weight: 800; }
    .modal-body {
      padding: 18px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .log-entry {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .log-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;

    .log-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .log-chip { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .log-add { background: #dcfce7; color: #166534; }
    .log-upd { background: #dbeafe; color: #1e40af; }
    .log-rem { background: #fee2e2; color: #991b1b; }
    html.dark .log-add { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    html.dark .log-upd { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    html.dark .log-rem { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(16px);
      background: #0f172a;
      color: #ffffff;
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 90;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .empty-state {
      background: var(--surface);
      border: 1.5px dashed var(--border-strong);
      border-radius: 18px;
      padding: 54px 24px;
      text-align: center;
      color: var(--text-secondary);

    .tone-blue   { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

      function detectInitialLang() {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('lang');
        if (q === 'en' || q === 'zh') return q;
        const saved = localStorage.getItem('lcmd-lang');
        if (saved === 'en' || saved === 'zh') return saved;
        return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
      }

      const urlParams = new URLSearchParams(window.location.search);
      const isEmbed = urlParams.get('embed') === '1';
      if (isEmbed) document.body.classList.add('embed-mode');

      const state = {
        data: null,
        lang: detectInitialLang(),
        view: localStorage.getItem('ms-view') || 'cards',
        scale: localStorage.getItem('ms-scale') || 'large',
        theme: urlParams.get('theme') || localStorage.getItem('lcmd-theme') || 'light',
        category: 'all',
        hw: 'all',
        query: '',
        showHidden: false,
        screenshotMode: false,
      };

      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));
      const t = () => I18N[state.lang];
      const isEn = () => state.lang === 'en';

      function showToast(msg) {
        const el = $('#toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
      }

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatGiB(v) {
        if (typeof v !== 'number' || Number.isNaN(v)) return '--';
        if (v < 0.1) return Math.floor(v * 1024) + 'M';
        return (Math.floor(v * 10) / 10) + 'G';
      }

      function modelTitle(m) {
        return isEn() ? (m.titleEn || m.title) : m.title;
      }
      function modelDesc(m) {
        return isEn() ? (m.descriptionEn || m.description) : m.description;
      }
      function catName(cat) {
        return isEn() ? (cat.en || cat.zh) : cat.zh;
      }
      function catSub(cat) {
        return isEn() ? cat.zh : cat.en;
      }
      function modelCatLabel(m) {
        return isEn() ? (m.categoryShortEn || m.categoryEn || m.categoryZh) : m.categoryZh;
      }

      function applyPreferences() {
        const L = t();
        document.documentElement.lang = isEn() ? 'en' : 'zh-CN';
        document.title = L.docTitle;
        document.documentElement.setAttribute('data-scale', state.scale);
        document.documentElement.classList.toggle('dark', state.theme === 'dark');
        document.body.classList.toggle('screenshot-mode', state.screenshotMode);

        $$('[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === state.view));
        $$('[data-scale]').forEach((b) => b.classList.toggle('active', b.dataset.scale === state.scale));
        $$('[data-hw]').forEach((b) => b.classList.toggle('active', b.dataset.hw === state.hw));
        $$('[data-lang]').forEach((b) => b.classList.toggle('active', b.dataset.lang === state.lang));

        $('#nav-back').textContent = L.navBack;
        $('#nav-back').href = `../?lang=${state.lang}`;
        $('#btn-v-cards').textContent = L.vCards;
        $('#btn-v-list').textContent = L.vList;
        $('#btn-v-wall').textContent = L.vWall;
        $('#btn-s-normal').textContent = L.sNormal;
        $('#btn-s-large').textContent = L.sLarge;
        $('#btn-s-xlarge').textContent = L.sXlarge;
        $('#btn-changelog').textContent = L.btnChangelog;
        $('#btn-copy-list').textContent = L.btnCopy;
        $('#btn-screenshot').textContent = L.btnShot;

        $('#hero-badge-text').textContent = L.heroBadge;
        $('#hero-title').textContent = L.heroTitle;
        $('#hero-sub').textContent = L.heroSub;
        $('#lbl-stat-visible').textContent = L.statVisible;
        $('#lbl-stat-cats').textContent = L.statCats;
        $('#lbl-stat-thor').textContent = L.statThor;
        $('#lbl-stat-orin').textContent = L.statOrin;
        $('#lbl-stat-multi').textContent = L.statMulti;

        $('#search-input').placeholder = L.searchPh;
        $('#hw-all').textContent = L.hwAll;
        $('#hw-thor-single').textContent = L.hwThorSingle;
        $('#hw-thor-multi').textContent = L.hwThorMulti;
        $('#hw-orin').textContent = L.hwOrin;
        $('#lbl-hidden').textContent = L.lblHidden;
        $('#footer-source').textContent = L.footerSource;

        $('#shot-label').textContent = L.shotLabel;
        $('#shot-view').textContent = L.shotView;
        $('#shot-scale').textContent = L.shotScale;
        $('#shot-print').textContent = L.shotPrint;
        $('#shot-exit').textContent = L.shotExit;
        $('#modal-title').textContent = L.modalTitle;
        $('#btn-close-modal').textContent = L.modalClose;
      }

      function matchesHw(m, hw) {
        if (hw === 'all') return true;
        if (hw === 'thor-single') return m.devices.includes('thor') && !m.isMultiNode;
        if (hw === 'thor-multi') return m.devices.includes('thor') && m.isMultiNode;
        if (hw === 'orin') return m.devices.includes('orin');
        return true;
      }

      function getBaseModels() {
        if (!state.data) return [];
        return state.data.models.filter((m) => (state.showHidden ? true : !m.hidden));
      }

      function getFilteredModels() {
        const q = state.query.trim().toLowerCase();
        return getBaseModels().filter((m) => {
          if (state.category !== 'all' && m.category !== state.category) return false;
          if (!matchesHw(m, state.hw)) return false;
          if (q) {
            const hay = [
              m.title,
              m.titleEn,
              m.categoryZh,
              m.categoryEn,
              m.meta,
              m.description,
              m.descriptionEn,
              m.packageId,
              m.badge,
              ...(m.hardware || []).map((h) => `${h.device} ${h.profile}`),
            ]
              .join(' ')
              .toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function renderHardwareLines(m) {
        const L = t();
        const list = m.hardware || [];
        if (!list.length) {
          return `<div class="hw-row hw-thor"><span class="hw-dev">${esc(m.meta || 'AGX')}</span></div>`;
        }
        return list
          .map((h) => {
            const isThor = h.device === 'thor';
            const cls = isThor ? (h.perDevice || m.deviceCount > 1 ? 'hw-thor-multi' : 'hw-thor') : 'hw-orin';
            const devName = isThor
              ? (h.perDevice && m.deviceCount > 1 ? `AGX Thor ×${m.deviceCount}` : 'AGX Thor')
              : 'AGX Orin';
            const memLabel = h.cpuOnly ? L.memRam : L.memVram;
            const diskOp = h.diskLowerBound ? '≥' : '≈';
            const perUnit = h.perDevice ? L.perNode : '';
            return `
              <div class="hw-row ${cls}">
                <span class="hw-dev">${esc(devName)}</span>
                <span class="hw-sep">·</span>
                <span>${memLabel} ≈ ${formatGiB(h.memoryGiB)}</span>
                <span class="hw-sep">·</span>
                <span>${L.disk} ${diskOp} ${formatGiB(h.diskGiB)}${perUnit}</span>
              </div>
            `;
          })
          .join('');
      }

      function renderShortHw(m) {
        const parts = [];
        if (m.devices.includes('thor')) parts.push(m.deviceCount > 1 ? `Thor ×${m.deviceCount}` : 'Thor');
        if (m.devices.includes('orin')) parts.push('Orin');
        return parts.join(' / ') || m.meta || '';
      }

      function renderCategoryChips() {
        const L = t();
        const base = getBaseModels().filter((m) => matchesHw(m, state.hw));
        const counts = {};
        for (const m of base) counts[m.category] = (counts[m.category] || 0) + 1;

        const chips = [
          `<button type="button" class="chip ${state.category === 'all' ? 'active' : ''}" data-cat="all">${esc(L.allModels)} <span class="chip-count">${base.length}</span></button>`,
        ];
        for (const cat of state.data.categories) {
          const c = counts[cat.key] || 0;
          if (!c) continue;
          chips.push(
            `<button type="button" class="chip ${state.category === cat.key ? 'active' : ''}" data-cat="${esc(cat.key)}">${esc(catName(cat))} <span class="chip-count">${c}</span></button>`,
          );
        }
        $('#cat-chips').innerHTML = chips.join('');
        $$('#cat-chips .chip').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.category = btn.dataset.cat;
            render();
          });
        });
      }

      function renderCardsView(groups) {
        const L = t();
        return groups
          .map(({ cat, items }) => {
            const tone = CATEGORY_TONES[cat.key] || 'slate';
            const cardsHtml = items
              .map((m) => {
                const coverFit = m.imageFit === 'contain' ? 'cover-contain' : '';
                const overlayHtml = m.coverTitle
                  ? `<div class="cover-overlay">
                      <strong class="${m.coverTitleCompact ? 'compact' : ''}">${esc(m.coverTitle)}</strong>
                      ${m.coverSubtitle ? `<span>${esc(m.coverSubtitle)}</span>` : ''}
                    </div>`
                  : '';
                const leftBadges = [
                  m.isNew ? `<span class="pill-float pill-new">${esc(L.newBadge)}</span>` : '',
                  m.hidden ? `<span class="pill-float pill-tag">${esc(L.hiddenBadge)}</span>` : '',
                ].filter(Boolean).join('');
                const rightBadge = m.badge ? `<span class="pill-float pill-tag">${esc(m.badge)}</span>` : '';

                return `
                  <article class="model-card ${m.hidden ? 'is-hidden-card' : ''}">
                    ${
                      m.image
                        ? `<div class="cover ${coverFit}">
                            <img src="${esc(m.image)}" alt="${esc(modelTitle(m))}" loading="lazy" />
                            ${overlayHtml}
                            ${leftBadges || rightBadge ? `<div class="cover-badges"><div>${leftBadges}</div><div>${rightBadge}</div></div>` : ''}
                          </div>`
                        : ''
                    }
                    <div class="card-body">
                      <div class="card-head">
                        <h3 class="card-title">${esc(modelTitle(m))}</h3>
                        <span class="cat-pill tone-${tone}">${esc(modelCatLabel(m))}</span>
                      </div>
                      <div class="hw-list">${renderHardwareLines(m)}</div>
                      <p class="card-desc">${esc(modelDesc(m))}</p>
                    </div>
                  </article>
                `;
              })
              .join('');

            return `
              <section class="cat-section">
                <div class="cat-header">
                  <span class="cat-dot dot-${tone}"></span>
                  <h2 class="cat-title">${esc(catName(cat))}</h2>
                  <span class="cat-en">${esc(catSub(cat))}</span>
                  <span class="cat-count">${esc(L.unitCount(items.length))}</span>
                </div>
                <div class="cards-grid">${cardsHtml}</div>
              </section>
            `;
          })
          .join('');
      }

      function renderListView(groups) {
        const L = t();
        return groups
          .map(({ cat, items }) => {
            const tone = CATEGORY_TONES[cat.key] || 'slate';
            const rowsHtml = items
              .map(
                (m) => `
                  <div class="list-row">
                    <div class="list-title-wrap">
                      <div class="list-title">${esc(modelTitle(m))}</div>
                      <div class="list-tags">
                        <span class="cat-pill tone-${tone}">${esc(modelCatLabel(m))}</span>
                        ${m.isNew ? `<span class="cat-pill" style="background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;">${esc(L.newBadge)}</span>` : ''}
                        ${m.badge ? `<span class="cat-pill tone-slate">${esc(m.badge)}</span>` : ''}
                        ${m.hidden ? `<span class="cat-pill tone-slate">${esc(L.hiddenShort)}</span>` : ''}
                      </div>
                    </div>
                    <div class="hw-list">${renderHardwareLines(m)}</div>
                    <p class="card-desc">${esc(modelDesc(m))}</p>
                  </div>
                `,
              )
              .join('');

            return `
              <section class="cat-section">
                <div class="cat-header">
                  <span class="cat-dot dot-${tone}"></span>
                  <h2 class="cat-title">${esc(catName(cat))}</h2>
                  <span class="cat-en">${esc(catSub(cat))}</span>
                  <span class="cat-count">${esc(L.unitCount(items.length))}</span>
                </div>
                <div class="list-table">${rowsHtml}</div>
              </section>
            `;
          })
          .join('');
      }

      function renderWallView(groups) {
        const L = t();
        const cards = groups
          .map(({ cat, items }) => {
            const tone = CATEGORY_TONES[cat.key] || 'slate';
            const itemsHtml = items
              .map(
                (m) => `
                  <div class="wall-item">
                    <span class="wall-item-name">${esc(modelTitle(m))}${m.isNew ? ' <span style="color:#ef4444;font-size:12px;">NEW</span>' : ''}</span>
                    <span class="wall-item-hw">${esc(renderShortHw(m))}</span>
                  </div>
                `,
              )
              .join('');

            return `
              <article class="wall-card">
                <div class="wall-head">
                  <div class="wall-head-left">
                    <span class="cat-dot dot-${tone}"></span>
                    <span class="wall-title">${esc(catName(cat))}</span>
                  </div>
                  <span class="wall-count tone-${tone}">${esc(L.unitCount(items.length))}</span>
                </div>
                <div class="wall-items">${itemsHtml}</div>
              </article>
            `;
          })
          .join('');
        return `<div class="wall-grid">${cards}</div>`;
      }

      function renderUpdateBanner() {
        const L = t();
        const banner = $('#update-banner');
        const logs = state.data?.changelog || [];
        const latest = logs.find((x) => !x.initial);
        if (!latest) {
          banner.style.display = 'none';
          return;
        }
        const parts = [];
        if (latest.prevAppVersion && latest.prevAppVersion !== latest.appVersion) {
          parts.push(L.verUpgrade(latest.prevAppVersion, latest.appVersion));
        }
        if (latest.added?.length) {
          parts.push(`${L.addedPrefix(latest.added.length)}${latest.added.map((x) => x.title).join(', ')}`);
        }
        if (latest.updated?.length) {
          parts.push(`${L.updatedPrefix(latest.updated.length)}${latest.updated.map((x) => x.title).join(', ')}`);
        }
        if (latest.removed?.length) {
          parts.push(`${L.removedPrefix(latest.removed.length)}${latest.removed.map((x) => x.title).join(', ')}`);
        }
        banner.style.display = 'flex';
        banner.innerHTML = `
          <div><strong>✨ ${esc(L.latestChange)} (${esc(latest.ts)}):</strong> ${esc(parts.join(' · '))}</div>
          <button type="button" class="btn" id="banner-open-log">${esc(L.viewChangelog)}</button>
        `;
        $('#banner-open-log')?.addEventListener('click', openChangelog);
      }

      function renderChangelogModal() {
        const L = t();
        const logs = state.data?.changelog || [];
        const html = logs
          .map((entry) => {
            const tags = [];
            for (const x of entry.added || []) tags.push(`<span class="log-chip log-add">+ ${esc(x.title)}</span>`);
            for (const x of entry.updated || []) tags.push(`<span class="log-chip log-upd">↻ ${esc(x.title)}</span>`);
            for (const x of entry.removed || []) tags.push(`<span class="log-chip log-rem">− ${esc(x.title)}</span>`);
            return `
              <div class="log-entry">
                <div class="log-top">
                  <span>AI Pod v${esc(entry.appVersion)}${entry.prevAppVersion && entry.prevAppVersion !== entry.appVersion ? ` (← v${esc(entry.prevAppVersion)})` : ''}</span>
                  <span style="color:var(--text-muted);font-weight:600;">${esc(entry.ts)}</span>
                </div>
                ${
                  entry.initial
                    ? `<div style="font-size:14px;color:var(--text-secondary);">${esc(L.baselineNote(entry.totalVisible))}</div>`
                    : `<div class="log-tags">${tags.join('') || '<span style="color:var(--text-muted)">Version update</span>'}</div>`
                }
              </div>
            `;
          })
          .join('');
        $('#changelog-body').innerHTML = html || '<div class="empty-state">No records yet</div>';
      }

      function openChangelog() {
        renderChangelogModal();
        $('#changelog-modal').classList.add('open');
      }

      function render() {
        if (!state.data) return;
        const L = t();
        applyPreferences();

        const d = state.data;
        $('#meta-version').textContent = `AI Pod v${d.appVersion}`;
        $('#meta-app-updated').textContent = `${L.metaAppUpdated}${d.appUpdatedAt}`;
        $('#meta-synced').textContent = `${L.metaSynced}${d.syncedAt}`;
        $('#footer-stamp').textContent = `AI Pod v${d.appVersion} · ${d.syncedAt}`;

        renderCategoryChips();
        renderUpdateBanner();

        const filtered = getFilteredModels();
        const activeCats = new Set(filtered.map((m) => m.category));
        $('#stat-visible').textContent = filtered.length;
        $('#stat-cats').textContent = activeCats.size;
        $('#stat-thor').textContent = filtered.filter((m) => m.devices.includes('thor')).length;
        $('#stat-orin').textContent = filtered.filter((m) => m.devices.includes('orin')).length;
        $('#stat-multi').textContent = filtered.filter((m) => m.isMultiNode).length;

        const filterNotes = [];
        if (state.hw === 'thor-single') filterNotes.push(L.hwThorSingle);
        if (state.hw === 'thor-multi') filterNotes.push(L.hwThorMulti);
        if (state.hw === 'orin') filterNotes.push(L.hwOrin);
        if (state.category !== 'all') {
          const cObj = d.categories.find((c) => c.key === state.category);
          if (cObj) filterNotes.push(catName(cObj));
        }
        if (state.query.trim()) filterNotes.push(`"${state.query.trim()}"`);
        $('#hero-filter-label').textContent = filterNotes.length ? `${L.filterPrefix}${filterNotes.join(' · ')}` : '';

        if (!filtered.length) {
          $('#content').innerHTML = `<div class="empty-state">${esc(L.emptyMsg)}</div>`;
          return;
        }

        const groups = d.categories
          .map((cat) => ({ cat, items: filtered.filter((m) => m.category === cat.key) }))
          .filter((g) => g.items.length > 0);

        if (state.view === 'list') $('#content').innerHTML = renderListView(groups);
        else if (state.view === 'wall') $('#content').innerHTML = renderWallView(groups);
        else $('#content').innerHTML = renderCardsView(groups);
      }

      function copyPlainList() {
        if (!state.data) return;
        const L = t();
        const filtered = getFilteredModels();
        const groups = state.data.categories
          .map((cat) => ({ cat, items: filtered.filter((m) => m.category === cat.key) }))
          .filter((g) => g.items.length > 0);

        const lines = [L.copyHeader(state.data.appVersion, state.data.appUpdatedAt.slice(0, 10), filtered.length)];
        for (const { cat, items } of groups) {
          lines.push(`■ ${catName(cat)} (${items.length})`);
          for (const m of items) {
            const hw = renderShortHw(m);
            const descOne = modelDesc(m).replace(/\s+/g, ' ').trim();
            lines.push(`  • ${modelTitle(m)}${hw ? ` [${hw}]` : ''} — ${descOne}`);
          }
          lines.push('');
        }
        const text = lines.join('\n').trim();
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(L.toastCopied(filtered.length)));
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          showToast(L.toastCopied(filtered.length));
        }
      }

      async function loadData() {
        applyPreferences();
        try {
          const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          state.data = await res.json();
          render();
        } catch (err) {
          $('#content').innerHTML = `<div class="empty-state">Failed to load model data: ${esc(err.message)}</div>`;
        }
      }

      $$('[data-view]').forEach((btn) =>
        btn.addEventListener('click', () => {
          state.view = btn.dataset.view;
          localStorage.setItem('ms-view', state.view);
          render();
        }),
      );

      $$('[data-scale]').forEach((btn) =>
        btn.addEventListener('click', () => {
          state.scale = btn.dataset.scale;
          localStorage.setItem('ms-scale', state.scale);
          applyPreferences();
        }),
      );

      $$('[data-hw]').forEach((btn) =>
        btn.addEventListener('click', () => {
          state.hw = btn.dataset.hw;
          render();
        }),
      );

      $$('[data-lang]').forEach((btn) =>
        btn.addEventListener('click', () => {
          state.lang = btn.dataset.lang;
          localStorage.setItem('lcmd-lang', state.lang);
          const url = new URL(window.location.href);
          url.searchParams.set('lang', state.lang);
          window.history.replaceState({}, '', url);
          render();
        }),
      );

      $('#chk-hidden').addEventListener('change', (e) => {
        state.showHidden = e.target.checked;
        render();
      });

      const searchInput = $('#search-input');
      const searchClear = $('#search-clear');
      searchInput.addEventListener('input', () => {
        state.query = searchInput.value;
        searchClear.classList.toggle('show', Boolean(state.query));
        render();
      });
      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        state.query = '';
        searchClear.classList.remove('show');
        render();
      });

      $('#btn-theme').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('lcmd-theme', state.theme);
        applyPreferences();
      });

      $('#btn-copy-list').addEventListener('click', copyPlainList);
      $('#btn-changelog').addEventListener('click', openChangelog);
      $('#btn-close-modal').addEventListener('click', () => $('#changelog-modal').classList.remove('open'));
      $('#changelog-modal').addEventListener('click', (e) => {
        if (e.target === $('#changelog-modal')) $('#changelog-modal').classList.remove('open');
      });

      $('#btn-screenshot').addEventListener('click', () => {
        state.screenshotMode = true;
        applyPreferences();
        showToast(t().toastShot);
      });
      $('#shot-exit').addEventListener('click', () => {
        state.screenshotMode = false;
        applyPreferences();
      });
      $('#shot-view').addEventListener('click', () => {
        const order = ['cards', 'list', 'wall'];
        state.view = order[(order.indexOf(state.view) + 1) % order.length];
        localStorage.setItem('ms-view', state.view);
        render();
      });
      $('#shot-scale').addEventListener('click', () => {
        const order = ['normal', 'large', 'xlarge'];
        state.scale = order[(order.indexOf(state.scale) + 1) % order.length];
        localStorage.setItem('ms-scale', state.scale);
        applyPreferences();
      });
      $('#shot-lang').addEventListener('click', () => {
        state.lang = state.lang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('lcmd-lang', state.lang);
        render();
      });
      $('#shot-print').addEventListener('click', () => window.print());

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if ($('#changelog-modal').classList.contains('open')) {
            $('#changelog-modal').classList.remove('open');
          } else if (state.screenshotMode) {
            state.screenshotMode = false;
            applyPreferences();
          }
        }
      });

      loadData();
    })();
  </script>
</body>
</html>
