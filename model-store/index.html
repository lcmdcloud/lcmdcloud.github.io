      function renderUpdateBanner() {
        const L = t();
        const banner = $('#update-banner');
        const logs = state.data?.changelog || [];
        const latest = logs.find((x) => !x.initial);
        if (!latest) {
          banner.style.display = 'none';
          return;
        }
        const parts = [];
        if (latest.prevAppVersion && latest.prevAppVersion !== latest.appVersion) {
          parts.push(L.verUpgrade(latest.prevAppVersion, latest.appVersion));
        }
        if (latest.added?.length) parts.push(`${L.addedPrefix(latest.added.length)}${latest.added.map((x) => x.title).join(', ')}`);
        if (latest.updated?.length) parts.push(`${L.updatedPrefix(latest.updated.length)}${latest.updated.map((x) => x.title).join(', ')}`);
        if (latest.removed?.length) parts.push(`${L.removedPrefix(latest.removed.length)}${latest.removed.map((x) => x.title).join(', ')}`);

        banner.style.display = 'flex';
        banner.innerHTML = `
          <div><strong>${esc(L.latestChange)} (${esc(latest.ts)}):</strong> ${esc(parts.join(' · '))}</div>
          <button type="button" class="btn" id="banner-open-log">${esc(L.viewChangelog)}</button>
        `;
        $('#banner-open-log')?.addEventListener('click', openChangelog);
      }

      function renderChangelogModal() {
        const L = t();
        const logs = state.data?.changelog || [];
        const html = logs
          .map((entry) => {
            const tags = [];
            for (const x of entry.added || []) tags.push(`<span class="log-chip log-add">+ ${esc(x.title)}</span>`);
            for (const x of entry.updated || []) tags.push(`<span class="log-chip log-upd">↻ ${esc(x.title)}</span>`);
            for (const x of entry.removed || []) tags.push(`<span class="log-chip log-rem">− ${esc(x.title)}</span>`);
            return `
              <div class="log-entry">
                <div class="log-top">
                  <span class="num">AI Pod v${esc(entry.appVersion)}${entry.prevAppVersion && entry.prevAppVersion !== entry.appVersion ? ` (← v${esc(entry.prevAppVersion)})` : ''}</span>
                  <span class="num" style="color:var(--ink-3);font-weight:600;">${esc(entry.ts)}</span>
                </div>
                ${
                  entry.initial
                    ? `<div style="font-size:13px;color:var(--ink-2);">${esc(L.baselineNote(entry.totalVisible))}</div>`
                    : `<div class="log-tags">${tags.join('') || '<span style="color:var(--ink-3)">Version update</span>'}</div>`
                }
              </div>
            `;
          })
          .join('');
        $('#changelog-body').innerHTML = html || '<div class="empty-state">No records yet</div>';
      }

      function openChangelog() {
        renderChangelogModal();
        $('#changelog-modal').classList.add('open');
      }

      function bindDetailClicks() {
        $$('#content [data-pkg]').forEach((el) => {
          el.addEventListener('click', () => openDetailModal(el.dataset.pkg));
        });
      }

      function render() {
        if (!state.data) return;
        const L = t();
        applyPreferences();

        const d = state.data;
        $('#meta-version').textContent = `AI Pod v${d.appVersion}`;
        $('#meta-stamp').textContent = L.stampText(d.appUpdatedAt || '', d.syncedAt || '');
        $('#footer-stamp').textContent = `AI Pod v${d.appVersion} · ${d.syncedAt}`;

        renderCategoryChips();
        renderUpdateBanner();

        const filtered = getFilteredModels();
        const activeCats = new Set(filtered.map((m) => m.category));
        $('#stat-visible').textContent = filtered.length;
        $('#stat-cats').textContent = activeCats.size;
        $('#stat-thor').textContent = filtered.filter((m) => m.devices.includes('thor')).length;
        $('#stat-orin').textContent = filtered.filter((m) => m.devices.includes('orin')).length;
        $('#stat-multi').textContent = filtered.filter((m) => m.isMultiNode).length;

        const filterNotes = [];
        if (state.hw === 'thor-single') filterNotes.push(L.hwThorSingle);
        if (state.hw === 'thor-multi') filterNotes.push(L.hwThorMulti);
        if (state.hw === 'orin') filterNotes.push(L.hwOrin);
        if (state.category !== 'all') {
          const cObj = d.categories.find((c) => c.key === state.category);
          if (cObj) filterNotes.push(catName(cObj));
        }
        if (state.query.trim()) filterNotes.push(`"${state.query.trim()}"`);

        const filterEl = $('#hero-filter-label');
        filterEl.textContent = filterNotes.length ? `${L.filterPrefix}${filterNotes.join(' · ')}` : '';
        filterEl.classList.toggle('show', filterNotes.length > 0);

        if (!filtered.length) {
          $('#content').innerHTML = `<div class="empty-state">${esc(L.emptyMsg)}</div>`;
          return;
        }

        const groups = d.categories
          .map((cat) => ({ cat, items: filtered.filter((m) => m.category === cat.key) }))
          .filter((g) => g.items.length > 0);

        if (state.view === 'list') $('#content').innerHTML = renderListView(groups);
        else if (state.view === 'wall') $('#content').innerHTML = renderWallView(groups);
        else $('#content').innerHTML = renderCardsView(groups);

        bindDetailClicks();
      }

      function copyPlainList() {
        if (!state.data) return;
        const L = t();
        const filtered = getFilteredModels();
        const groups = state.data.categories
          .map((cat) => ({ cat, items: filtered.filter((m) => m.category === cat.key) }))
          .filter((g) => g.items.length > 0);

        const lines = [L.copyHeader(state.data.appVersion, state.data.appUpdatedAt.slice(0, 10), filtered.length)];
        for (const { cat, items } of groups) {
          lines.push(`■ ${catName(cat)} (${items.length})`);
          for (const m of items) {
            const hw = renderShortHw(m);
            const descOne = modelDesc(m).replace(/\s+/g, ' ').trim();
            lines.push(`  • ${modelTitle(m)}${hw ? ` [${hw}]` : ''} — ${descOne}`);
          }
          lines.push('');
        }
        const text = lines.join('\n').trim();
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(L.toastCopied(filtered.length)));
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          showToast(L.toastCopied(filtered.length));
        }
      }

      async function loadData() {
        applyPreferences();
        try {
          const res = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          state.data = await res.json();
          render();
        } catch (err) {
          $('#content').innerHTML = `<div class="empty-state">Failed to load model data: ${esc(err.message)}</div>`;
        }
      }

      // ==================== Force Pull Update & 5s Auto-Dismiss Popup ====================
      const GITHUB_RAW_DATA_URL = 'https://raw.githubusercontent.com/lcmdcloud/lcmdcloud.github.io/main/model-store/data.json';
      const GITHUB_RAW_COVERS_BASE = 'https://raw.githubusercontent.com/lcmdcloud/lcmdcloud.github.io/main/model-store/';

      function modelFingerprint(m) {
        return JSON.stringify({
          t: m.title,
          te: m.titleEn,
          d: m.description,
          de: m.descriptionEn,
          h: Boolean(m.hidden),
          c: m.category,
          dc: m.deviceCount,
          hw: (m.hardware || []).map((x) => `${x.device}:${x.memoryGiB}:${x.diskGiB}:${x.profile || ''}`),
          rv: m.release?.version || '',
        });
      }

      function diffModelData(prev, next) {
        const prevMap = new Map((prev?.models || []).map((m) => [m.packageId, m]));
        const nextMap = new Map((next?.models || []).map((m) => [m.packageId, m]));
        const added = [];
        const updated = [];
        const removed = [];

        for (const [id, nm] of nextMap.entries()) {
          const pm = prevMap.get(id);
          if (!pm) {
            added.push(nm);
          } else if (modelFingerprint(pm) !== modelFingerprint(nm)) {
            updated.push(nm);
          }
        }
        for (const [id, pm] of prevMap.entries()) {
          if (!nextMap.has(id)) removed.push(pm);
        }

        const versionChanged = Boolean(prev?.appVersion && next?.appVersion && prev.appVersion !== next.appVersion);
        const syncedChanged = Boolean(prev?.syncedTs && next?.syncedTs && next.syncedTs > prev.syncedTs);
        const hasChanges = versionChanged || added.length > 0 || updated.length > 0 || removed.length > 0 || (syncedChanged && prev?.appUpdatedAt !== next?.appUpdatedAt);
        return { versionChanged, prevVersion: prev?.appVersion, nextVersion: next?.appVersion, added, updated, removed, hasChanges };
      }

      async function fetchJsonNoCache(url, timeoutMs = 9000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const sep = url.includes('?') ? '&' : '?';
          const res = await fetch(`${url}${sep}force=${Date.now()}&r=${Math.random().toString(36).slice(2, 7)}`, {
            cache: 'no-store',
            signal: ctrl.signal,
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } finally {
          clearTimeout(timer);
        }
      }

      function normalizeRawCovers(data) {
        if (!data?.models) return data;
        return {
          ...data,
          models: data.models.map((m) => {
            if (m.image && m.image.startsWith('./covers/')) {
              return { ...m, image: GITHUB_RAW_COVERS_BASE + m.image.slice(2) };
            }
            return m;
          }),
        };
      }

      const popupTimer = { raf: null, start: 0, remaining: 5000, paused: false };

      function closeSyncPopup() {
        const el = $('#sync-popup');
        if (el) el.classList.remove('show');
        if (popupTimer.raf) {
          cancelAnimationFrame(popupTimer.raf);
          popupTimer.raf = null;
        }
      }

      function showSyncPopup({ type, title, subtitle, versionBadge, diff, totalVisible, durationMs = 5000 }) {
        const L = t();
        const el = $('#sync-popup');
        closeSyncPopup();

        const iconSvg =
          type === 'updated'
            ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
            : type === 'error'
              ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
              : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="16 10 11 15 8 12"/></svg>`;

        let detailsHtml = '';
        if (type === 'updated' && diff) {
          const statPills = [];
          if (diff.added.length) statPills.push(`<span class="log-chip log-add num">${esc(L.syncCountAdd(diff.added.length))}</span>`);
          if (diff.updated.length) statPills.push(`<span class="log-chip log-upd num">${esc(L.syncCountUpd(diff.updated.length))}</span>`);
          if (diff.removed.length) statPills.push(`<span class="log-chip log-rem num">${esc(L.syncCountRem(diff.removed.length))}</span>`);
          if (typeof totalVisible === 'number') statPills.push(`<span class="badge ctx num">${esc(L.syncCountTotal(totalVisible))}</span>`);

          const rows = [
            ...diff.added.map((m) => ({ kind: 'add', tag: L.syncTagAdd, cls: 'log-add', m })),
            ...diff.updated.map((m) => ({ kind: 'upd', tag: L.syncTagUpd, cls: 'log-upd', m })),
            ...diff.removed.map((m) => ({ kind: 'rem', tag: L.syncTagRem, cls: 'log-rem', m })),
          ];

          const maxRows = 6;
          const visibleRows = rows.slice(0, maxRows);
          const extra = rows.length - visibleRows.length;

          detailsHtml = `
            ${statPills.length ? `<div class="sync-pop-stats">${statPills.join('')}</div>` : ''}
            ${
              visibleRows.length
                ? `<div class="sync-pop-list">
                    ${visibleRows
                      .map(
                        (r) => `
                      <div class="sync-pop-item">
                        <div class="sync-pop-item-l">
                          <span class="log-chip ${r.cls}" style="padding:1px 6px;font-size:10.5px;">${esc(r.tag)}</span>
                          <span class="sync-pop-item-name">${esc(modelTitle(r.m))}</span>
                        </div>
                        <span class="badge ctx num" style="font-size:10px;padding:1px 5px;">${esc(renderShortHw(r.m))}</span>
                      </div>
                    `,
                      )
                      .join('')}
                    ${extra > 0 ? `<div class="sync-pop-more">${esc(L.syncMore(extra))}</div>` : ''}
                  </div>`
                : ''
            }
          `;
        }

        el.innerHTML = `
          <div class="sync-pop-inner">
            <div class="sync-pop-head">
              <div class="sync-pop-icon ${type}">${iconSvg}</div>
              <div class="sync-pop-main">
                <div class="sync-pop-title-row">
                  <span class="sync-pop-title">${esc(title)}</span>
                  ${versionBadge ? `<span class="badge thor num">${esc(versionBadge)}</span>` : ''}
                </div>
                ${subtitle ? `<div class="sync-pop-sub num">${esc(subtitle)}</div>` : ''}
              </div>
              <div class="sync-pop-ctrl">
                <span class="sync-pop-cd num" id="sync-pop-cd">${Math.ceil(durationMs / 1000)}s</span>
                <button type="button" class="sync-pop-close" id="sync-pop-close" aria-label="Close">×</button>
              </div>
            </div>
            ${detailsHtml}
          </div>
          <div class="sync-pop-bar"><div class="sync-pop-bar-fill ${type}" id="sync-pop-bar-fill"></div></div>
        `;

        $('#sync-pop-close')?.addEventListener('click', closeSyncPopup);
        requestAnimationFrame(() => el.classList.add('show'));

        popupTimer.remaining = durationMs;
        popupTimer.paused = false;
        let lastTs = performance.now();

        const tick = (now) => {
          const dt = now - lastTs;
          lastTs = now;
          if (!popupTimer.paused) {
            popupTimer.remaining = Math.max(0, popupTimer.remaining - dt);
            const ratio = popupTimer.remaining / durationMs;
            const fill = $('#sync-pop-bar-fill');
            const cd = $('#sync-pop-cd');
            if (fill) fill.style.transform = `scaleX(${ratio})`;
            if (cd) cd.textContent = `${Math.max(1, Math.ceil(popupTimer.remaining / 1000))}s`;
          }
          if (popupTimer.remaining <= 0) {
            closeSyncPopup();
            return;
          }
          popupTimer.raf = requestAnimationFrame(tick);
        };
        popupTimer.raf = requestAnimationFrame(tick);
      }

      const syncPopupEl = $('#sync-popup');
      syncPopupEl.addEventListener('mouseenter', () => { popupTimer.paused = true; });
      syncPopupEl.addEventListener('mouseleave', () => { popupTimer.paused = false; });

      async function forcePullUpdate() {
        if (state.syncing) return;
        const L = t();
        const btn = $('#btn-force-sync');
        state.syncing = true;
        btn.disabled = true;
        btn.classList.add('loading');
        $('#lbl-force-sync').textContent = L.btnSyncing;

        try {
          const isRemoteHost = /^https?:$/i.test(window.location.protocol) && !['localhost', '127.0.0.1'].includes(window.location.hostname);
          const tasks = [
            fetchJsonNoCache('./data.json').then((d) => ({ source: 'local', data: d })),
          ];
          if (isRemoteHost) {
            tasks.push(
              fetchJsonNoCache(GITHUB_RAW_DATA_URL).then((d) => ({ source: 'github-raw', data: d })),
            );
          }

          const settled = await Promise.allSettled(tasks);
          const okResults = settled.filter((r) => r.status === 'fulfilled' && r.value?.data?.models).map((r) => r.value);
          if (!okResults.length) {
            const firstErr = settled.find((r) => r.status === 'rejected')?.reason;
            throw new Error(firstErr?.message || 'Network error');
          }

          // Pick freshest payload by syncedTs, falling back to local
          okResults.sort((a, b) => (b.data.syncedTs || 0) - (a.data.syncedTs || 0));
          const best = okResults[0];
          const nextData = best.source === 'github-raw' ? normalizeRawCovers(best.data) : best.data;

          const prevData = state.data;
          const diff = diffModelData(prevData, nextData);
          const visCount = (nextData.models || []).filter((m) => !m.hidden).length;

          if (!prevData || diff.hasChanges) {
            state.data = nextData;
            render();
            const verBadge = diff.versionChanged
              ? `v${diff.prevVersion} → v${diff.nextVersion}`
              : `v${nextData.appVersion}`;
            showSyncPopup({
              type: 'updated',
              title: L.syncUpdatedTitle,
              subtitle: L.syncUpdatedSub(nextData.appVersion, visCount, nextData.syncedAt || ''),
              versionBadge: verBadge,
              diff,
              totalVisible: visCount,
              durationMs: 5000,
            });
          } else {
            showSyncPopup({
              type: 'none',
              title: L.syncNoneTitle,
              subtitle: L.syncNoneSub(nextData.appVersion, visCount, nextData.syncedAt || ''),
              durationMs: 5000,
            });
          }
        } catch (err) {
          showSyncPopup({
            type: 'error',
            title: L.syncErrTitle,
            subtitle: err.message || String(err),
            durationMs: 5000,
          });
        } finally {
          state.syncing = false;
          btn.disabled = false;
          btn.classList.remove('loading');
          $('#lbl-force-sync').textContent = t().btnForceSync;
        }
      }

      $$('[data-view]').forEach((btn) =>
        btn.addEventListener('click', () => {
          state.view = btn.dataset.view;
          localStorage.setItem('ms-view', state.view);
          render();
        }),
      );

      $$('[data-scale]').forEach((btn) =>
        btn.addEventListener('click', () => {
          state.scale = btn.dataset.scale;
          localStorage.setItem('ms-scale', state.scale);
          applyPreferences();
        }),
      );

      $$('[data-hw]').forEach((btn) =>
        btn.addEventListener('click', () => {
          state.hw = btn.dataset.hw;
          render();
        }),
      );

      $$('[data-lang]').forEach((btn) =>
        btn.addEventListener('click', () => {
          state.lang = btn.dataset.lang;
          localStorage.setItem('lcmd-lang', state.lang);
          const url = new URL(window.location.href);
          url.searchParams.set('lang', state.lang);
          window.history.replaceState({}, '', url);
          render();
        }),
      );

      $('#chk-hidden').addEventListener('change', (e) => {
        state.showHidden = e.target.checked;
        render();
      });

      const searchInput = $('#search-input');
      const searchClear = $('#search-clear');
      searchInput.addEventListener('input', () => {
        state.query = searchInput.value;
        searchClear.classList.toggle('show', Boolean(state.query));
        render();
      });
      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        state.query = '';
        searchClear.classList.remove('show');
        render();
      });

      $('#btn-theme').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('lcmd-theme', state.theme);
        applyPreferences();
      });

      $('#btn-force-sync').addEventListener('click', forcePullUpdate);
      $('#btn-copy-list').addEventListener('click', copyPlainList);
      $('#btn-changelog').addEventListener('click', openChangelog);
      $('#btn-close-modal').addEventListener('click', () => $('#changelog-modal').classList.remove('open'));
      $('#changelog-modal').addEventListener('click', (e) => {
        if (e.target === $('#changelog-modal')) $('#changelog-modal').classList.remove('open');
      });
      $('#btn-close-detail').addEventListener('click', () => $('#detail-modal').classList.remove('open'));
      $('#detail-modal').addEventListener('click', (e) => {
        if (e.target === $('#detail-modal')) $('#detail-modal').classList.remove('open');
      });

      $('#btn-screenshot').addEventListener('click', () => {
        state.screenshotMode = true;
        applyPreferences();
        showToast(t().toastShot);
      });
      $('#shot-exit').addEventListener('click', () => {
        state.screenshotMode = false;
        applyPreferences();
      });
      $('#shot-view').addEventListener('click', () => {
        const order = ['cards', 'list', 'wall'];
        state.view = order[(order.indexOf(state.view) + 1) % order.length];
        localStorage.setItem('ms-view', state.view);
        render();
      });
      $('#shot-scale').addEventListener('click', () => {
        const order = ['normal', 'large', 'xlarge'];
        state.scale = order[(order.indexOf(state.scale) + 1) % order.length];
        localStorage.setItem('ms-scale', state.scale);
        applyPreferences();
      });
      $('#shot-lang').addEventListener('click', () => {
        state.lang = state.lang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('lcmd-lang', state.lang);
        render();
      });
      $('#shot-print').addEventListener('click', () => window.print());

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if ($('#sync-popup').classList.contains('show')) {
            closeSyncPopup();
          } else if ($('#detail-modal').classList.contains('open')) {
            $('#detail-modal').classList.remove('open');
          } else if ($('#changelog-modal').classList.contains('open')) {
            $('#changelog-modal').classList.remove('open');
          } else if (state.screenshotMode) {
            state.screenshotMode = false;
            applyPreferences();
          }
        }
      });

      loadData();
    })();
  </script>
</body>
</html>
