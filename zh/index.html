  <link rel="shortcut icon" href="../favicon.ico" />
  <meta http-equiv="refresh" content="0; url=../?lang=zh" />
  <script>
    (function () {
      try { localStorage.setItem('lcmd-lang', 'zh'); } catch (e) {}
      var params = new URLSearchParams(window.location.search);
      if (!params.get('lang')) params.set('lang', 'zh');
      var qs = params.toString();

      window.location.replace(target);
    })();
  </script>
